.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nt{background:var(--chip);color:var(--sub);border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:13px;line-height:1.45}.nt b{color:var(--text);font-weight:700}

/* Store: true full-screen responsive layout on phone, tablet, desktop and TV */
html,body{width:100%;min-width:0;height:100%;min-height:100%;overflow:hidden}
body{max-width:none!important;width:100%;margin:0;min-height:100dvh;min-height:100svh;min-height:100vh}
main{width:100%;max-width:none;min-width:0;min-height:0;height:0;flex:1 1 auto;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.keyboard-open nav#nav{position:fixed!important;bottom:0!important;transform:none!important;}
nav#nav{display:flex!important;flex:none!important;width:100%!important;height:calc(64px + env(safe-area-inset-bottom,0px))!important;min-height:64px!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:200!important;visibility:visible!important;opacity:1!important;background:var(--surface)!important;border-top:1px solid var(--line)!important;padding:6px 0 env(safe-area-inset-bottom,0px)!important;box-shadow:0 -3px 14px rgba(0,0,0,.08)!important}
nav#nav button{visibility:visible!important;opacity:1!important;min-height:56px!important;height:56px!important}
main#main{padding-bottom:128px!important;scroll-behavior:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.search,.tabs,.pay,.head,.row,.chips,.list,.acc{max-width:none}
.sv{max-width:none!important;width:100%;left:0;right:0}

@media (max-width:599px){
  nav#nav{display:flex!important;transform:none!important;visibility:visible!important;opacity:1!important}
  nav#nav button{flex:1 1 25%!important;display:flex!important}
  .sv{z-index:300!important}
}

@media (min-width:600px){
  .search{margin-left:2vw;margin-right:2vw}
  .tabs{padding-left:2vw;padding-right:2vw}
  .hero{margin-left:2vw;margin-right:2vw}
  .row,.list,.chips,.pay,.head,.acc{padding-left:2vw;padding-right:2vw}
  .tl2{grid-template-columns:repeat(2,minmax(0,1fr))}
}

  .search{margin-top:6px;height:44px}

}

/* Best-effort media protection: prevents the common save/copy/drag paths. */
(function(){
  document.addEventListener('contextmenu',function(e){
    if(e.target && (e.target.closest('img') || e.target.closest('.ic,.hlogo,.avatar,.qrb'))) e.preventDefault();
  },true);
  document.addEventListener('dragstart',function(e){
    if(e.target && e.target.closest && e.target.closest('img')) e.preventDefault();
  },true);
  document.addEventListener('copy',function(e){
    var sel=window.getSelection&&window.getSelection();
    if(sel && sel.toString()){
      e.preventDefault();
      try{
        e.clipboardData.setData('text/plain',sel.toString());
        e.clipboardData.setData('text/html','<span style="color:#F3F1E9">'+esc(sel.toString())+'</span>');
      }catch(_){}
    }
  },true);
})();

function doWithdraw(b){var x=wdCheck();if(!x||!sb||b.dataset.w)return;b.dataset.w=1;b.classList.add('dis');b.textContent='Please wait...';wdCall(0,x).then(async function(r){if(!r||r.error){var m=r&&r.error&&r.error.message||'';banner(false,/schema cache|find the function/i.test(m)?'Withdrawal is not available yet':m.slice(0,80)||'Withdrawal failed');return}banner(true,'Withdrawal request sent');wAmtV='';wUpiV='';await loadWithdrawalRows()}).catch(function(){banner(false,'Withdrawal failed')}).finally(function(){delete b.dataset.w;b.classList.remove('dis');b.textContent='Process';wdCheck()})}
async function cancelWithdrawal(id){if(!id||!sb)return;try{var r=await sb.rpc('cancel_withdrawal',{p_request_id:id});if(r&&r.error)throw r.error;delete wdHidden[id];await loadWithdrawalRows();hubBal();if(sPage==='history')sHist();banner(true,'Withdrawal request cancelled')}catch(e){banner(false,String(e.message||'Could not cancel request').slice(0,100))}}
document.addEventListener('input',function(e){var i=e.target.id;if(i!='wa'&&i!='wu')return;
 if(i=='wa')wAmtV=e.target.value;else wUpiV=e.target.value;
 var r1=document.getElementById('wrng'),r2=document.getElementById('wurng');
 if(r1)r1.classList.toggle('bad',wAmtV!==''&&!wdAmtOk());if(r2)r2.classList.toggle('bad',wUpiV.trim()!==''&&!wdUpiOk());wdCheck()});

function sHead(title){return '<div class="sh"><button class="ib" data-s="back" aria-label="Back">'+IC.back+'</button><h3>'+title+'</h3></div>'}
function sRender(){
 var h='';
 if(sPage=='profile'){
  h=sHead('Profile')+'<div class="sb"><div class="profileCard"><div class="accountProfile">'+
    '<div class="avatar big">'+avHtml()+'</div>'+
    '<div class="an">'+esc(U.name)+'</div>'+
    '<div class="am">'+esc(U.email)+'</div>'+
    '<span class="profileBadge">Account profile</span>'+
    '<div class="accountActions"><button type="button" class="deleteAccount" data-s="delete">Delete account</button></div>'+
    '</div></div></div>';
 }else if(sPage=='payment'){
  h=sHead('Payment &amp; subscription')+'<div class="sb"><div class="hb"><small>Wallet Balance</small><div class="hv">\u20B9<span class="balv">'+balTxt()+'</span></div></div>'
  +'<div class="tl2"><button class="tile" data-s="wd"><i>'+HI.wd+'</i>Withdrawal</button><button class="tile" data-s="dep"><i>'+HI.dep+'</i>Deposit</button></div>'
  +'<button class="sc" data-s="hist" style="margin-top:18px;border-top:1px solid var(--line)"><span class="lg" style="background:var(--chip);color:var(--text)">'+HI.hist+'</span><span class="tx">Transaction history<span class="sm">Deposits, withdrawals and trades</span></span>'+HI.chv+'</button>'
  +'<button class="sc" data-s="subs"><span class="lg" style="background:var(--chip);color:var(--text)">'+HI.sub+'</span><span class="tx">Subscription &amp; autopay<span class="sm">Manage recurring payments</span></span>'+HI.chv+'</button></div>';
 }else if(sPage=='subs'){
  h=sHead('Subscription &amp; autopay')+'<div class="sb"><div class="sl">Subscriptions</div><div class="sm" style="color:var(--sub);font-size:14px;padding:4px 2px">No active subscriptions.</div><div class="sl" style="margin-top:14px">Autopay</div><div class="sm" style="color:var(--sub);font-size:14px;padding:4px 2px">No autopay set up.</div></div>';
 }else if(sPage=='history'){
  h=sHead('Transaction history')+'<div class="sb" id="hl2"><div class="empty">Loading\u2026</div></div>';
 }else if(sPage=='withdraw'){
  h=sHead('Withdrawal')+'<div class="pay paymentPage"><div class="pc2"><small>Wallet Balance</small><div class="big"><span>\u20B9</span><span class="balv">'+balTxt()+'</span></div></div>'
  +'<input id="wa" class="in" type="number" inputmode="numeric" min="10" max="10000" placeholder="Enter amount" value="'+esc(wAmtV)+'">'
  +'<input id="wu" class="in" type="text" placeholder="Enter your UPI ID" autocapitalize="off" autocomplete="off" spellcheck="false" value="'+esc(wUpiV)+'" style="margin-top:10px">'
  +'<button class="go dis" id="wgo" data-s="wgo" style="margin-top:14px">Process</button>'
  +'<div class="nt"><b>Note:</b> Your payment will be successfully processed after 24 hours.</div>'
  +'<div class="wd-list"><div class="dep-title">Withdrawal requests</div>'+wdRowsHtml()+'</div></div>';
 }else if(sPage=='connected'){
  h=sHead('Connected')+'<div class="sb">'
  +crow(LG('gh'),'GitHub','',true,true)
  +crow(LG('sb'),'Supabase','',true,true)
  +crow(LG('n8'),'n8n','',true,true)
  +crow(LG('oa'),'OAuth','Google',true,true)+'</div>';
 }else if(sPage=='policy'){
  h=sHead('Legal')+'<div class="sb">'
  +'<a class="sc" href="'+POLICY_URLS.privacy+'" target="_blank" rel="noopener" style="text-decoration:none">'+IC.policy+'<span class="tx">Privacy policy</span>'+IC.ext+'</a>'
  +'<a class="sc" href="'+POLICY_URLS.terms+'" target="_blank" rel="noopener" style="text-decoration:none">'+IC.doc+'<span class="tx">Terms of service</span>'+IC.ext+'</a></div>';
 }
 SV.innerHTML=h;
 if(sPage=='payment')hubBal();
 if(sPage=='withdraw'){wdCheck();hubBal();document.getElementById('nav').style.display='none'}
 if(sPage=='history')sHist();
}
function sShow(k){sPage=k;sRender();if(k==='withdraw')document.getElementById('nav').style.display='none';SV.classList.add('show')}
function sClose(){SV.classList.remove('show');DIM.classList.remove('show');document.getElementById('nav').style.display=(nv===3&&pay)?'none':''}

 DIM.innerHTML='<div class="dlg"><h4>Color mode</h4>'+[['sys',IC.phone,'System'],['light',IC.sun,'Light'],['dark',IC.moon,'Dark']].map(function(o){
  return '<button class="fo'+(theme==o[0]?' on':'')+'" data-s="c:'+o[0]+'">'+o[1]+'<span class="tx">'+o[2]+'</span>'+IC.ck+'</button>'}).join('')+'</div>';

 DIM.innerHTML='<div class="dlg confirmDlg"><h4>Log out?</h4><p>Are you sure you want to log out of this account?</p><div class="dbt"><button data-s="cancel">Cancel</button><button class="rd" data-s="out!">Confirm</button></div></div>';
 DIM.classList.add('show');
}
function deleteDlg(){
 DIM.innerHTML='<div class="dlg dangerDlg"><h4>Delete account?</h4><p>This will permanently delete <b>all of your account data</b>, including your profile, wallet balance, deposits, withdrawals and transaction history. <b>This action cannot be undone.</b></p><div class="dbt"><button type="button" data-s="cancel">Cancel</button><button type="button" class="rd" data-s="delete!">Confirm</button></div></div>';
 DIM.classList.add('show');
}
async function deleteAccount(){
 if(!sb){banner(false,'Delete service unavailable');return}
 var b=document.querySelector('[data-s="delete!"]');if(b){b.disabled=true;b.textContent='Deleting…'}
 try{
  var sr=await sb.auth.getSession(),ss=sr&&sr.data&&sr.data.session;
  if(!ss||!ss.user)throw new Error('Your session has expired. Please sign in again.');
  var r=await sb.rpc('delete_my_account');
  if(r&&r.error)throw r.error;
  loggedOut=true;clearViewed();clearAuth();DIM.classList.remove('show');SV.classList.remove('show');
  setUser(null);banner(true,'Account deleted successfully');setTimeout(function(){location.replace(LOGIN_URL)},700);
 }catch(e){
  if(b){b.disabled=false;b.textContent='Confirm'}
  var m=String((e&&e.message)||'Could not delete account');
  if(/function .*delete_my_account.*does not exist|schema cache/i.test(m))m='Delete account service is not configured on the server.';
  else if(/permission|not allowed|denied/i.test(m))m='Delete account permission is not enabled.';
  banner(false,m.slice(0,140));
 }
}
function fontDlg(){
 DIM.innerHTML='<div class="dlg"><h4>Font style</h4>'
 +'<button class="fo'+(font=='def'?' on':'')+'" data-s="f:def"><span class="tx">Default</span>'+IC.ck+'</button>'
 +'<button class="fo'+(font=='sys'?' on':'')+'" data-s="f:sys"><span class="tx">System</span>'+IC.ck+'</button></div>';
 DIM.classList.add('show');
}
document.addEventListener('click',function(e){
 if(e.target===DIM){DIM.classList.remove('show');return}
 var b=e.target.closest('[data-s]');if(!b)return;var k=b.dataset.s;
 if(k=='back'){if(sPage=='history')sShow('payment');else sClose()}
 else if(k=='profile'||k=='connected'||k=='policy')sShow(k);
 else if(k=='payment'||k=='subs'||k=='wd'||k=='hist')sShow(k=='wd'?'withdraw':k=='hist'?'history':k);
 else if(k.indexOf('wt:')==0){wtab=k.slice(3);sRender()}
 else if(k=='dep'){hubBack=true;sClose();nv=3;pay=true;render();hubBal();document.getElementById('main').scrollTop=0}
 else if(k=='wgo')doWithdraw(b)
 else if(k=='color')colorDlg();
 else if(k.indexOf('c:')==0){theme=k.slice(2);try{localStorage.setItem(THEME_KEY,theme)}catch(x){}applyTheme();DIM.classList.remove('show');render()}
 else if(k=='font')fontDlg();
 else if(k.indexOf('f:')==0){font=k.slice(2);try{localStorage.setItem(FONT_KEY,font)}catch(x){}applyFont();DIM.classList.remove('show');render()}
 else if(k=='out'){outDlg()}
 else if(k=='delete')deleteDlg();
 else if(k=='cancel')DIM.classList.remove('show');
 else if(k=='out!'){DIM.classList.remove('show');sClose();signOut()}
 else if(k=='delete!'){deleteAccount()}
});
try{render()}catch(e){showErr('Something went wrong','Please reload the page.',function(){location.reload()},'Reload');}
if(!navigator.onLine)banner(false,'No internet connection',true);
startup();
