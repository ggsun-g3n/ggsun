<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twozyer Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F3F1E9;--surface:#fff;--text:#1f1f1f;--sub:#5f6368;--line:#dcd9cc;--chip:#e7e4d8;--chipOn:#F3F1E9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a16;--surface:#26241f;--text:#ecebe4;--sub:#a9a79c;--line:#3a3830;--chip:#33312a;--chipOn:#46443a}}
:root[data-theme="dark"]{--bg:#1b1a16;--surface:#26241f;--text:#ecebe4;--sub:#a9a79c;--line:#3a3830;--chip:#33312a;--chipOn:#46443a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
::selection,input::selection{background:#F3F1E9;color:#1f1f1f}
button:focus:not(:focus-visible){outline:none}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.search{margin:12px 14px 6px;background:var(--surface);border-radius:28px;height:48px;display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--text);font-family:inherit}
.search input::placeholder{color:var(--sub)}
.avatar{width:32px;height:32px;border-radius:50%;background:#F3F1E9;color:#1f1f1f;display:grid;place-items:center;font-size:14px;font-weight:600;border:1px solid var(--line);cursor:pointer;font-family:inherit}
.avatar.big{width:72px;height:72px;font-size:30px;cursor:default}
.tabs{display:flex;gap:22px;padding:6px 18px 0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{padding:10px 0;font-size:14px;color:var(--sub);white-space:nowrap;cursor:pointer;border:0;background:none;border-bottom:3px solid transparent;font-family:inherit}
.tab.on{color:var(--text);border-color:var(--text);font-weight:600}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.hero{margin:12px 14px 8px;border-radius:18px;min-height:190px;cursor:pointer;background:#D9480F;color:#F3F1E9;padding:20px;position:relative;overflow:visible;display:flex;flex-direction:column;justify-content:flex-end}
.hlogo{position:absolute;right:-30px;top:-12px;width:132px;height:132px;border-radius:50%;background:#F3F1E9;display:block}
.adtag{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#F3F1E9}
.hero small{font-size:12px;font-weight:600}.hero h2{font-size:22px;margin:4px 0 6px;max-width:62%}
.hero p{font-size:13px;opacity:.9;max-width:70%;margin-bottom:12px}
.btn{align-self:flex-start;background:#F3F1E9;color:#D9480F;border:0;border-radius:20px;padding:8px 24px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.8;cursor:default}
.head{padding:16px 14px 8px}.head h3{font-size:18px;font-weight:500}
.row{display:flex;gap:14px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:96px;cursor:pointer}
.card .ic{width:96px;height:96px;border-radius:24px}
.card .n{font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:12px;color:var(--sub);margin-top:2px}
.chips{display:flex;gap:8px;padding:0 14px 6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:10px;padding:8px 18px;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:none;border-color:var(--text);font-weight:600}
.list{padding:0 14px}
.item{display:flex;align-items:center;gap:14px;padding:10px 0}
.ic{position:relative;overflow:hidden;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:#D9480F;flex:none}
.ic img,.hlogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%}
.hlogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%;background:transparent;padding:18%;border:0;outline:0;box-shadow:none;transform:none}
.item div.t{flex:1;min-width:0}.item .n{font-size:16px}.item .m{font-size:12px;color:var(--sub);margin-top:2px}
.inst{border:1px solid var(--line);background:none;color:var(--text);border-radius:18px;padding:7px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;min-width:92px}
.inst.open{background:var(--text);color:var(--bg);border-color:var(--text)}
.inst:disabled{cursor:default;color:var(--sub)}
.sp{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--text);border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pay{padding:0 14px 12px}
.phead{display:flex;align-items:center;gap:6px;padding:14px 0 6px}
.phead h3{font-size:18px;font-weight:500}
.back{border:0;background:none;color:var(--text);font-size:24px;padding:2px 10px 2px 0;cursor:pointer;font-family:inherit}
.pc{background:#D9480F;color:#F3F1E9;border-radius:18px;padding:18px 20px;margin:8px 0 14px}
.pc small{font-size:12px;font-weight:600}.pc h2{font-size:22px;margin-top:4px}
.pay h4{font-size:15px;font-weight:500;margin:14px 0 8px}
.amts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:14px;font-size:16px;font-family:inherit;outline:0}
.go{width:100%;margin-top:14px;background:var(--text);color:var(--bg);border:0;border-radius:24px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.acc{display:flex;flex-direction:column;align-items:center;padding:28px 14px 12px;gap:4px}
.an{font-size:20px;font-weight:500;margin-top:10px}.am{font-size:14px;color:var(--sub)}
.r2{display:flex;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.r2 b{color:var(--sub);font-weight:400}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-top:6px}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:0 0 8px;font-size:12px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav .pill{width:60px;height:30px;border-radius:15px;display:grid;place-items:center}
nav button.on{color:var(--text);font-weight:600}nav button.on .pill{background:var(--chipOn);color:var(--text)}
.empty{padding:60px 24px;text-align:center;color:var(--sub);font-size:15px}
.ov{position:fixed;inset:0;background:#fff;z-index:50;opacity:0}
.fly{position:fixed;z-index:52;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dot{position:fixed;z-index:51;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%}
.mw{position:fixed;z-index:53;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:24px}
.mw img{width:200px;max-width:55vw;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));animation:pop .55s cubic-bezier(.2,1.4,.4,1) both,wob 1.1s ease-in-out .55s infinite}
.mw .bar{width:120px;height:4px;border-radius:2px;background:#e7e4d8;overflow:hidden}
.mw .bar i{display:block;height:100%;width:0;background:#9fd414;animation:fill var(--d,2600ms) linear forwards}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-8px)}}
@keyframes fill{to{width:100%}}
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:opacity .35s}
#boot.hide{opacity:0;pointer-events:none}
.bsp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
.bt{font-size:14px;color:var(--sub)}
.et{font-size:20px;font-weight:500;color:var(--text)}
.rb{border:0;border-radius:24px;padding:12px 30px;font-size:15px;font-weight:700;background:var(--text);color:var(--bg);cursor:pointer;font-family:inherit}
.rl{border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer;font-family:inherit;padding:6px}
.nb{position:fixed;left:0;right:0;top:0;z-index:120;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#d93025;color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transform:translateY(-100%);transition:transform .3s}
.nb.show{transform:none}
.nb.ok{background:#1e8e3e}
</style>
</head>
<body>
<div id="boot"><div class="bsp"></div><div class="bt">Loading&hellip;</div></div>
<div class="nb" id="nb"></div>

<main id="main"></main>

var timers=[];

  var paused=false,t;
  ['touchstart','mousedown','wheel'].forEach(function(ev){r.addEventListener(ev,function(){paused=true;clearTimeout(t);t=setTimeout(function(){paused=false},4000)},{passive:true})});
  timers.push(setInterval(function(){
   if(paused||!r.firstElementChild)return;
   var step=r.firstElementChild.offsetWidth+14;
   if(r.scrollLeft+r.clientWidth>=r.scrollWidth-4)r.scrollTo({left:0,behavior:'smooth'});
   else r.scrollBy({left:step,behavior:'smooth'});
