<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #131313;
  --box: #232323;
  --surface: #1c1c1c;
  --text: #ececec;
  --muted: #8a8a85;
  --accent: #d97757;
  --user: #2b2b2b;
  --border: #2e2e2e;
  --danger: #e5867a;
  --success: #7ec98f;
  --warn: #fab387;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "DM Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column;
  height: 100dvh; overflow: hidden;
}
button:focus { outline: none; }


#chat {
  flex: 1; overflow-y: auto;
  padding: 56px 12px 4px;
  display: flex; flex-direction: column; gap: 10px;
}


#load-sentinel {
  display: flex; justify-content: center; padding: 4px 0 8px;
}
#load-sentinel[hidden] { display: none; }
#load-more-btn {
  background: var(--box); border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 12px; padding: 6px 18px; border-radius: 20px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
}
#load-more-btn:active { background: #2a2a2a; }


.msg {
  max-width: 80%; padding: 8px 12px; border-radius: 14px;
  white-space: pre-wrap; word-wrap: break-word; word-break: break-word; overflow-wrap: break-word;
}
.msg.user {
  align-self: flex-end; max-width: 78%;
  background: var(--user); padding: 10px 14px; border-radius: 16px; font-size: 15px;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
}
.msg.user.selectable { -webkit-user-select: text; user-select: text; }
.msg.err {
  color: var(--danger); font-size: 13px;
  background: rgba(229,134,122,0.08); border: 1px solid rgba(229,134,122,0.18);
  border-radius: 12px; padding: 10px 14px; max-width: 92%;
}
.msg.policy {
  color: var(--muted); font-size: 13px; line-height: 1.55;
  background: rgba(250,179,135,0.06); border: 1px solid rgba(250,179,135,0.18);
  border-radius: 12px; padding: 10px 14px; max-width: 92%;
}


.menu {
  position: fixed; z-index: 300; min-width: 190px;
  background: #2a2a2a; border: 1px solid #333; border-radius: 16px;
  padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.55);
}
.menu button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: transparent; border: 0; color: var(--text);
  font: inherit; font-size: 15px; padding: 11px 12px; border-radius: 10px;
  text-align: left; cursor: pointer;
}
.menu button:active { background: #353535; }
.menu svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }


.ai-wrap { align-self: flex-start; width: 100%; max-width: 100%; }
.ai-wrap .msg { padding: 2px 2px 0; max-width: 92%; }
.ai-wrap .msg, .ai-wrap .msg * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }


.actions { display: flex; gap: 4px; margin-top: 6px; }
.actions button {
  background: transparent; border: 0; color: var(--muted);
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center; cursor: pointer;
}
.actions button:active { background: #262626; }
.actions button.on { color: var(--text); }
.actions svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.actions button.on svg { fill: currentColor; }
.actions button.full-only { display: none; }
.ai-wrap.latest .actions button.full-only { display: grid; }


.dots span {
  display: inline-block; width: 5px; height: 5px; margin-right: 3px;
  border-radius: 50%; background: var(--muted); animation: blink 1s infinite ease-in-out;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}


.composer {
  margin: 6px 12px 12px;
  background: var(--box); border: 1px solid #2c2c2c; border-radius: 26px;
  padding: 8px 8px 8px 18px; min-height: 54px;
  display: flex; align-items: center; gap: 8px;
}
.composer textarea {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; resize: none;
  color: var(--text); font: inherit; font-size: 16px; line-height: 24px;
  max-height: 200px; height: 24px; padding: 0; margin: 0; display: block; overflow-y: auto;
}
.composer textarea::placeholder { color: var(--muted); }
.send {
  flex: none; width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: 0; display: grid; place-items: center;
  cursor: pointer; aspect-ratio: 1;
}
.send:disabled { opacity: .35; cursor: default; }


#top-fade {
  position: fixed; top: 0; left: 0; right: 0; height: 72px;
  background: linear-gradient(to bottom, var(--bg) 40%, transparent);
  z-index: 19; pointer-events: none;
}
#settings-btn {
  position: fixed; top: calc(env(safe-area-inset-top,0px) + 10px); left: 14px;
  z-index: 20; width: 36px; height: 36px; background: transparent; border: 0;
  border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--muted);
}
#settings-btn:active { background: #2a2a2a; }
#settings-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }


.code-block {
  background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 12px;
  overflow: hidden; margin: 4px 0 6px; width: 100%; max-width: calc(100vw - 24px);
}
.code-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px 8px 14px; background: #222; border-bottom: 1px solid #2e2e2e;
}
.code-lang { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.code-copy {
  background: transparent; border: 0; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-family: inherit; padding: 2px 4px; border-radius: 6px;
}
.code-copy:active { background: #333; }
.code-copy svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.code-copy.copied { color: var(--success); }
.code-body { overflow-x: auto; padding: 14px; -webkit-user-select: text; user-select: text; }
.code-body pre { margin: 0; font-family: "SFMono-Regular","Fira Code","Consolas",monospace; font-size: 13px; line-height: 1.6; white-space: pre; color: #cdd6f4; }
.ck{color:#cba6f7} .cs{color:#a6e3a1} .cc{color:#585b70;font-style:italic}
.cn{color:#fab387} .cf{color:#89b4fa} .cp{color:#f38ba8} .cbi{color:#89dceb}


#settings-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.88);
  display: flex; align-items: flex-end; justify-content: center;
}
#settings-overlay[hidden] { display: none !important; }

#settings-panel {
  width: 100%; max-width: 560px;
  background: #1a1a1a; border-radius: 22px 22px 0 0;
  border-top: 1px solid #2e2e2e;
  display: flex; flex-direction: column;
  max-height: 92dvh;
  animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

.s-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.s-header h2 { font-size: 17px; font-weight: 500; }
.s-close-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: #2a2a2a; border: 0; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; font-size: 15px; flex-shrink: 0;
}
.s-close-btn:active { background: #333; }

.s-body {
  flex: 1; overflow-y: auto; padding: 18px 20px;
  display: flex; flex-direction: column; gap: 22px;
}
.s-group { display: flex; flex-direction: column; gap: 8px; }
.s-label {
  font-size: 11px; font-weight: 500; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em;
}
.s-input {
  background: var(--box); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font: inherit; font-size: 15px;
  padding: 11px 14px; width: 100%; outline: none; transition: border-color 0.15s;
}
.s-input:focus { border-color: var(--accent); }
.s-input::placeholder { color: var(--muted); }
.s-textarea {
  background: var(--box); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font: inherit; font-size: 14px; line-height: 1.55;
  padding: 11px 14px; width: 100%; outline: none; resize: none;
  min-height: 130px; max-height: 260px; transition: border-color 0.15s;
}
.s-textarea:focus { border-color: var(--accent); }
.s-textarea::placeholder { color: var(--muted); }


.conn-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #404040; flex-shrink: 0; }
.conn-dot.ok  { background: var(--success); }
.conn-dot.err { background: var(--danger); }
.conn-dot.busy { background: var(--warn); animation: pulseDot 0.7s infinite; }
#conn-error {
  margin-top: 8px; padding: 10px 12px; border-radius: 10px;
  background: rgba(229,134,122,0.08); border: 1px solid rgba(229,134,122,0.25);
  color: var(--danger); font-family: monospace; font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-all;
  -webkit-user-select: text; user-select: text; max-height: 160px; overflow-y: auto;
}
#conn-error[hidden] { display: none; }
#conn-copy {
  margin-top: 6px; background: var(--box); border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
}
#conn-copy[hidden] { display: none; }
@keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.3} }


.sysprompt-hint {
  font-size: 12px; color: var(--muted); line-height: 1.55;
  background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;
}
.sysprompt-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.upload-txt-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--box); border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 10px; cursor: pointer;
}
.upload-txt-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.upload-txt-btn:active { background: #2a2a2a; }
.char-count { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#sysprompt-file { display: none; }


.s-footer {
  display: flex; gap: 10px; padding: 14px 20px;
  border-top: 1px solid var(--border); flex-shrink: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
.btn-cancel {
  flex: 1; background: var(--box); border: 1px solid var(--border);
  color: var(--text); font: inherit; font-size: 15px; font-weight: 500;
  padding: 13px; border-radius: 14px; cursor: pointer;
}
.btn-cancel:active { background: #2a2a2a; }
.btn-save {
  flex: 2; background: var(--accent); border: 0;
  color: #fff; font: inherit; font-size: 15px; font-weight: 500;
  padding: 13px; border-radius: 14px; cursor: pointer;
}
.btn-save:active { opacity: 0.8; }
</style>
</head>
<body>

<div id="top-fade"></div>

<button id="settings-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<div id="chat" aria-live="polite">
  <div id="load-sentinel" hidden>
    <button id="load-more-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      Load earlier messages
    </button>
  </div>
</div>

<div class="composer">
  <textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
  <button id="send" class="send" aria-label="Send" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</div>

<!-- ── Settings Modal ── -->
<div id="settings-overlay" hidden>
  <div id="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="s-header">
      <h2>Settings</h2>
      <button class="s-close-btn" id="s-close-x" aria-label="Close">✕</button>
    </div>

    <div class="s-body">

      <!-- API Key -->
      <div class="s-group">
        <label class="s-label" for="s-apikey">API Key</label>
        <input type="password" id="s-apikey" class="s-input"
               placeholder="Paste your API key here…"
               autocomplete="off" spellcheck="false">
      </div>

      <!-- Model -->
      <div class="s-group">
        <label class="s-label" for="s-model">Model Name</label>
        <input type="text" id="s-model" class="s-input"
               placeholder="e.g. grok-beta, grok-2, claude-sonnet-4-6"
               autocomplete="off" spellcheck="false">
      </div>

      <!-- Connection status (auto) -->
      <div class="s-group">
        <div class="s-label">Connection</div>
        <div class="conn-status">
          <div class="conn-dot" id="conn-dot"></div>
          <span id="conn-label">Enter API key to connect</span>
        </div>
        <div id="conn-error" hidden></div>
        <button id="conn-copy" type="button" hidden>Copy error</button>
      </div>

      <!-- System prompt -->
      <div class="s-group">
        <div class="s-label">System Prompt</div>
        <div class="sysprompt-hint">
          Long prompts are loaded once at session start, not on every message. Keep under 8 KB for smooth mobile use.
        </div>
        <div class="sysprompt-actions">
          <button class="upload-txt-btn" id="upload-sysprompt-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload .txt
          </button>
          <span class="char-count" id="sysprompt-chars">0 chars</span>
        </div>
        <input type="file" id="sysprompt-file" accept=".txt">
        <textarea id="s-sysprompt" class="s-textarea"
                  placeholder="Enter system instructions… (optional)"></textarea>
      </div>

    </div>

    <div class="s-footer">
      <button class="btn-cancel" id="s-cancel" type="button">Cancel</button>
      <button class="btn-save"   id="s-save"   type="button">Save</button>
    </div>
  </div>
</div>

<script>

const CHUNK       = 10;
const MAX_HISTORY = 120; // max messages to keep in localStorage
const DEFAULT_MODEL    = 'grok-beta';
const DEFAULT_SYSPROMPT = 'Always wrap ALL code (any language) in markdown code fences with the language name like ```js ... ``` or ```python ... ```. Never use plain text for code. Use **bold** for emphasis. Be helpful and concise.';
const POLICY_MESSAGE = '⚠️ This request was declined. We don\'t provide responses involving harmful, violent, abusive, or illegal content. Please keep conversations safe and respectful.';


let cfg     = loadCfg();
let history = [];       // [{role:'user'|'assistant', content}] — API context
let msgLog  = [];       // [{role:'user'|'ai', text, type}]     — display log
let msgNodes = [];      // all DOM nodes ever added to chat
let visibleFrom = 0;    // index in msgNodes where DOM starts
let busy = false;
let mockIdx = 0;


function loadCfg() {
  try {
    const s = localStorage.getItem('ai_cfg');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { apiKey: '', model: DEFAULT_MODEL, sysprompt: DEFAULT_SYSPROMPT };
}
function saveCfg() {
  try { localStorage.setItem('ai_cfg', JSON.stringify(cfg)); } catch(e) {}
}
function loadMsgLog() {
  try {
    const s = localStorage.getItem('ai_msglog');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return [];
}
function saveMsgLog() {
  try {
    // Keep last MAX_HISTORY entries
    const trimmed = msgLog.slice(-MAX_HISTORY);
    localStorage.setItem('ai_msglog', JSON.stringify(trimmed));
    // Also keep API history in sync
    localStorage.setItem('ai_history', JSON.stringify(history.slice(-MAX_HISTORY)));
  } catch(e) {}
}
function loadApiHistory() {
  try {
    const s = localStorage.getItem('ai_history');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return [];
}


const ICON = {
  copy:  '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  up:    '<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 0 1 3 1.7L13.4 9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>',
  down:  '<svg viewBox="0 0 24 24"><path d="M7 13V4H4v9zM7 13l4 7a2 2 0 0 0 3-1.7L13.4 15H19a2 2 0 0 0 2-2.3l-1.2-7A2 2 0 0 0 17.8 4H7"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>',
  edit:  '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg>'
};


function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function outsideTags(s, regex, replacer) {
  return s.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, text) => tag ? tag : text.replace(regex, replacer));
}

function highlight(code, lang) {
  let s = escHtml(code);
  const L = (lang||'').toLowerCase();
  const isJS   = /^(js|javascript|ts|typescript|jsx|tsx|node)$/.test(L);
  const isPY   = /^(py|python)$/.test(L);
  const isCSS  = /^(css|scss|sass)$/.test(L);
  const isHTML = /^(html|xml|svg)$/.test(L);
  if (isHTML) {
    s = s.replace(/(&lt;\/?)([\w-]+)/g,'$1<span class="cf">$2</span>').replace(/([\w-]+=)(&quot;[^&]*&quot;)/g,'<span class="cn">$1</span><span class="cs">$2</span>');
    return s;
  }
  s = s.replace(/(&#x27;[^&#]*&#x27;|&quot;[^&]*&quot;|`[^`]*`)/g, m=>'<span class="cs">'+m+'</span>');
  if (isCSS) s = s.replace(/(\/\*[\s\S]*?\*\/)/g, m=>'<span class="cc">'+m+'</span>');
  else       s = s.replace(/(\/\/[^\n]*)/g, m=>'<span class="cc">'+m+'</span>');
  s = outsideTags(s, /\b(\d+\.?\d*)\b/g, '<span class="cn">$1</span>');
  if (isJS || isPY) {
    const kwJS = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|import|export|default|from|async|await|try|catch|finally|throw|typeof|instanceof|in|of|void|delete|null|undefined|true|false|this|super|static|get|set|yield|type|interface|enum|declare|readonly|as|is)\b/g;
    const kwPY = /\b(def|return|if|elif|else|for|while|import|from|as|class|try|except|finally|raise|with|pass|break|continue|lambda|and|or|not|in|is|None|True|False|async|await|yield|global|nonlocal|del|assert|print)\b/g;
    s = outsideTags(s, isPY ? kwPY : kwJS, '<span class="ck">$1</span>');
    s = outsideTags(s, /\b(console|Math|Array|Object|String|Number|Boolean|Promise|JSON|Error|window|document|parseInt|parseFloat|isNaN|setTimeout|setInterval|fetch|navigator|localStorage|sessionStorage)\b/g, '<span class="cbi">$1</span>');
    s = outsideTags(s, /\b([a-zA-Z_$][\w$]*)(?=\s*\()/g, m => m.match(/\b(const|let|var|function|return|if|else|for|while|class|import|export|async|await|def|elif|from|with)\b/) ? m : '<span class="cf">'+m+'</span>');
  }
  return s;
}

function buildCodeBlock(code, lang) {
  const w = document.createElement('div'); w.className = 'code-block';
  const hdr = document.createElement('div'); hdr.className = 'code-header';
  const lbl = document.createElement('span'); lbl.className = 'code-lang'; lbl.textContent = lang||'code';
  hdr.appendChild(lbl);
  const cpBtn = document.createElement('button'); cpBtn.className = 'code-copy';
  cpBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Copy</span>';
  cpBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); cpBtn.classList.add('copied'); cpBtn.querySelector('span').textContent='Copied!'; setTimeout(()=>{cpBtn.classList.remove('copied');cpBtn.querySelector('span').textContent='Copy';},2000); } catch(e){}
  });
  hdr.appendChild(cpBtn); w.appendChild(hdr);
  const body = document.createElement('div'); body.className='code-body';
  const pre = document.createElement('pre'); pre.innerHTML = highlight(code, lang);
  body.appendChild(pre); w.appendChild(body); return w;
}

function inlineMD(raw) {
  return escHtml(raw)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:#2a2a2a;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;color:#fab387">$1</code>');
}
function makeTextDiv(raw) {
  const t = document.createElement('div'); t.className='msg';
  t.style.cssText='padding:4px 2px;max-width:92%;line-height:1.55;';
  t.innerHTML = inlineMD(raw); return t;
}
function renderContent(text) {
  const frag = document.createDocumentFragment();
  const re = /```([a-zA-Z0-9]*)\r?\n?([\s\S]*?)```/g;
  let last=0, m;
  while((m=re.exec(text))!==null){
    const before = text.slice(last,m.index).trim();
    if(before) frag.appendChild(makeTextDiv(before));
    frag.appendChild(buildCodeBlock(m[2].trimEnd(), m[1]||'code'));
    last = m.index + m[0].length;
  }
  const after = text.slice(last).trim();
  if(after) frag.appendChild(makeTextDiv(after));
  return frag;
}


const chat     = document.getElementById('chat');
const sentinel = document.getElementById('load-sentinel');
const loadBtn  = document.getElementById('load-more-btn');

function pushNode(node) {
  msgNodes.push(node);
  chat.appendChild(node);
  // If visible count exceeds 2 chunks, unload oldest chunk
  const visCount = msgNodes.length - visibleFrom;
  if (visCount > CHUNK * 2) {
    const removeCount = CHUNK;
    for (let i = visibleFrom; i < visibleFrom + removeCount; i++) {
      if (msgNodes[i] && msgNodes[i].parentNode === chat) {
        chat.removeChild(msgNodes[i]);
      }
    }
    visibleFrom += removeCount;
    sentinel.hidden = false;
  }
}

function loadPrevChunk() {
  if (visibleFrom <= 0) return;
  const newFrom = Math.max(0, visibleFrom - CHUNK);
  const scrollBottom = chat.scrollHeight - chat.scrollTop;
  for (let i = visibleFrom - 1; i >= newFrom; i--) {
    if (msgNodes[i]) {
      const ref = sentinel.nextSibling;
      chat.insertBefore(msgNodes[i], ref);
    }
  }
  visibleFrom = newFrom;
  chat.scrollTop = chat.scrollHeight - scrollBottom;
  if (visibleFrom <= 0) sentinel.hidden = true;
}

loadBtn.addEventListener('click', loadPrevChunk);
chat.addEventListener('scroll', () => {
  if (chat.scrollTop < 80 && visibleFrom > 0) loadPrevChunk();
}, { passive: true });


let menuEl = null;
function closeMenu() { if(menuEl){menuEl.remove();menuEl=null;} }

function showMenu(bubble, text) {
  closeMenu();
  const isLatest = bubble === [...chat.querySelectorAll('.msg.user')].pop();
  const m = document.createElement('div'); m.className='menu';
  const item = (label, icon, fn) => {
    const b = document.createElement('button'); b.type='button';
    b.innerHTML = icon+'<span>'+label+'</span>';
    b.addEventListener('click',()=>{closeMenu();fn();}); m.appendChild(b);
  };
  item('Copy message', ICON.copy, async ()=>{ try{await navigator.clipboard.writeText(text);}catch(e){} });
  if(isLatest && !busy) item('Edit', ICON.edit, ()=>editLatest(bubble,text));
  document.body.appendChild(m); menuEl=m;
  const br=bubble.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  let top=br.bottom+8; if(top+mh>innerHeight-8) top=Math.max(8,br.top-mh-8);
  let left=Math.min(Math.max(8,br.right-mw),innerWidth-mw-8);
  m.style.top=top+'px'; m.style.left=left+'px';
}
function attachLongPress(el, text) {
  let timer=null, sx=0, sy=0;
  const cancel=()=>{clearTimeout(timer);timer=null;};
  el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;cancel();timer=setTimeout(()=>{timer=null;showMenu(el,text);},450);});
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)cancel();});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,cancel));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!menuEl.contains(e.target))closeMenu();},true);
chat.addEventListener('scroll',closeMenu);

function editLatest(bubble, text) {
  // Remove this bubble and everything after it from DOM and msgNodes
  const idx = msgNodes.indexOf(bubble);
  if (idx !== -1) {
    for (let i = idx; i < msgNodes.length; i++) {
      if (msgNodes[i].parentNode) msgNodes[i].remove();
    }
    msgNodes = msgNodes.slice(0, idx);
  }
  // Trim history and msgLog
  for (let i=history.length-1;i>=0;i--) {
    if(history[i].role==='user'){history.length=i;break;}
  }
  for (let i=msgLog.length-1;i>=0;i--) {
    if(msgLog[i].role==='user'){msgLog.length=i;break;}
  }
  markLatest();
  input.value=text; resize(); input.focus();
  saveMsgLog();
}


function addUser(text) {
  const d = document.createElement('div'); d.className='msg user'; d.textContent=text;
  attachLongPress(d,text); pushNode(d); chat.scrollTop=chat.scrollHeight;
}

function makeActionBtn(label, icon, cls, onclick) {
  const b = document.createElement('button'); b.type='button';
  b.setAttribute('aria-label',label); b.className=cls||''; b.innerHTML=icon;
  b.addEventListener('click',onclick); return b;
}

function addAI(text, type) {
  // type: 'normal' | 'error' | 'policy'
  const wrap = document.createElement('div'); wrap.className='ai-wrap';
  if (type==='error') {
    const m=document.createElement('div'); m.className='msg err'; m.textContent=text; wrap.appendChild(m);
  } else if (type==='policy') {
    const m=document.createElement('div'); m.className='msg policy'; m.textContent=text; wrap.appendChild(m);
  } else {
    wrap.appendChild(renderContent(text));
    const row=document.createElement('div'); row.className='actions';
    row.appendChild(makeActionBtn('Copy',ICON.copy,'',async()=>{try{await navigator.clipboard.writeText(text);}catch(e){}}));
    const up=makeActionBtn('Good response',ICON.up,'',()=>{up.classList.toggle('on');down.classList.remove('on');});
    const down=makeActionBtn('Bad response',ICON.down,'',()=>{down.classList.toggle('on');up.classList.remove('on');});
    row.appendChild(up); row.appendChild(down);
    row.appendChild(makeActionBtn('Retry',ICON.retry,'full-only',retry));
    wrap.appendChild(row);
  }
  pushNode(wrap); markLatest(); chat.scrollTop=chat.scrollHeight; return wrap;
}

function markLatest() {
  const all = chat.querySelectorAll('.ai-wrap');
  all.forEach((w,i)=>w.classList.toggle('latest',i===all.length-1));
}


function getEndpoint(model) {
  const m = (model||'').toLowerCase();
  if (m.startsWith('grok') || m.startsWith('x-')) {
    return { url:'https://api.x.ai/v1/chat/completions', type:'openai' };
  }
  if (m.startsWith('claude')) {
    return { url:'https://api.anthropic.com/v1/messages', type:'anthropic' };
  }
  // Fallback: OpenAI-compatible (xAI default)
  return { url:'https://api.x.ai/v1/chat/completions', type:'openai' };
}

async function rawFetch(url, opts, ep) {
  try {
    return await fetch(url, opts);
  } catch (e) {
    const err = new Error('NETWORK');
    err.raw = 'Network/CORS error (' + (e && e.name) + '): ' + (e && e.message) + '\nURL: ' + url;
    throw err;
  }
}
async function failFrom(res, ms, code, ep) {
  let body = '';
  try { body = await res.text(); } catch (e) {}
  const err = new Error(code);
  err.ms = ms;
  err.raw = 'HTTP ' + res.status + ' ' + (res.statusText || '') + '\nURL: ' + ep.url + '\n' + body;
  return err;
}

async function callAPI(messages, model, apiKey, sysprompt) {
  const ep = getEndpoint(model);
  const t0 = performance.now();

  if (ep.type === 'openai') {
    const msgs = sysprompt
      ? [{role:'system', content:sysprompt}, ...messages]
      : messages;
    const res = await rawFetch(ep.url, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body: JSON.stringify({model, messages:msgs, max_tokens:2000})
    }, ep);
    const ms = Math.round(performance.now()-t0);
    if (!res.ok) {
      const code = res.status;
      let k = 'HTTP_'+code;
      if (code===401) k='AUTH_ERROR';
      else if (code===429) k='RATE_LIMIT';
      const e = await failFrom(res, ms, k, ep);
      if (code===400) {
        if (e.raw.toLowerCase().includes('content')) e.message='POLICY_VIOLATION';
        else e.message='BAD_REQUEST:'+e.raw;
      }
      throw e;
    }
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content||'';
    if (!text) throw Object.assign(new Error('EMPTY_RESPONSE'),{ms});
    return {text, ms};

  } else {
    // Anthropic
    const res = await rawFetch(ep.url, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model, max_tokens:2000,
        ...(sysprompt?{system:sysprompt}:{}),
        messages
      })
    }, ep);
    const ms = Math.round(performance.now()-t0);
    if (!res.ok) {
      const code = res.status;
      let k = 'HTTP_'+code;
      if (code===401) k='AUTH_ERROR';
      else if (code===429) k='RATE_LIMIT';
      throw await failFrom(res, ms, k, ep);
    }
    const data = await res.json();
    const text = (data.content||[]).map(i=>i.type==='text'?i.text:'').join('\n').trim();
    if (!text) throw Object.assign(new Error('EMPTY_RESPONSE'),{ms});
    return {text, ms};
  }
}

function friendlyError(err) {
  const m = err?.message||'';
  if (m==='AUTH_ERROR')         return 'Authentication failed — please check your API key in Settings.';
  if (m==='RATE_LIMIT')         return 'Rate limit reached. Wait a moment and try again.';
  if (m==='EMPTY_RESPONSE')     return 'The model returned an empty response. Please try again.';
  if (m==='POLICY_VIOLATION')   return null; // show policy message instead
  if (m.startsWith('BAD_REQUEST:')) return 'Bad request: ' + m.slice(12);
  if (m.startsWith('HTTP_'))    return 'Server error (' + m.slice(5) + '). Please try again.';
  if (m.includes('fetch')||m.includes('network')||m.includes('Failed'))
                                return 'Network error — check your internet connection and try again.';
  return 'Something went wrong. Please try again.';
}


const MOCKS = [
  "Hello! I'm your AI assistant. Configure your API key in ⚙️ Settings to connect to a real model.",
  "This is a **demo response**. Open Settings → paste your API key → save, and messages will go to the AI.\n\nSupported models: `grok-beta`, `grok-2`, `claude-sonnet-4-6` and more.",
  "Here's a code example:\n```js\nconst greet = name => `Hello, ${name}!`;\nconsole.log(greet('World'));\n```",
  "Features of this chat:\n- Conversation **persists** after refresh\n- Virtual scroll for long chats\n- Code blocks with syntax highlighting\n- Long-press to copy or edit messages"
];


async function ask() {
  busy=true; resize();
  const typingWrap = document.createElement('div'); typingWrap.className='ai-wrap';
  typingWrap.innerHTML='<div class="msg"><span class="dots"><span></span><span></span><span></span></span></div>';
  chat.appendChild(typingWrap); chat.scrollTop=chat.scrollHeight;

  try {
    let reply, ms=0;
    if (!cfg.apiKey) {
      await new Promise(r=>setTimeout(r,900+Math.random()*500));
      reply = MOCKS[mockIdx++ % MOCKS.length];
    } else {
      const result = await callAPI(history, cfg.model||DEFAULT_MODEL, cfg.apiKey, cfg.sysprompt||DEFAULT_SYSPROMPT);
      reply=result.text; ms=result.ms;
    }
    typingWrap.remove();

    // Detect self-refusal from model
    const lower = reply.toLowerCase();
    const isPolicyRefusal = lower.length<500 && (
      lower.includes("i can't help with that") ||
      lower.includes("i cannot help with that") ||
      lower.includes("i'm not able to assist") ||
      lower.includes("against my guidelines") ||
      lower.includes("violates my") ||
      lower.includes("content policy")
    );

    if (isPolicyRefusal) {
      msgLog.push({role:'ai', text:POLICY_MESSAGE, type:'policy'});
      addAI(POLICY_MESSAGE,'policy');
    } else {
      history.push({role:'assistant',content:reply});
      msgLog.push({role:'ai', text:reply, type:'normal'});
      addAI(reply,'normal');
    }
    saveMsgLog();

  } catch(e) {
    typingWrap.remove();
    if (e?.message==='POLICY_VIOLATION') {
      msgLog.push({role:'ai', text:POLICY_MESSAGE, type:'policy'});
      addAI(POLICY_MESSAGE,'policy');
    } else {
      const errTxt = friendlyError(e);
      msgLog.push({role:'ai', text:errTxt, type:'error'});
      addAI(errTxt,'error');
    }
    saveMsgLog();
  } finally {
    busy=false; resize();
  }
}

const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');

function send() {
  const text = input.value.trim();
  if (!text||busy) return;
  input.value=''; resize();
  addUser(text);
  history.push({role:'user',content:text});
  msgLog.push({role:'user',text});
  ask();
  saveMsgLog();
}

function retry() {
  if (busy) return;
  if (history.length && history[history.length-1].role==='assistant') history.pop();
  if (msgLog.length && msgLog[msgLog.length-1].role==='ai') msgLog.pop();
  const all = chat.querySelectorAll('.ai-wrap');
  if (all.length) {
    const last=all[all.length-1];
    const idx=msgNodes.indexOf(last);
    if(idx!==-1) msgNodes.splice(idx,1);
    last.remove();
  }
  markLatest(); ask(); saveMsgLog();
}

function resize() {
  input.style.height='24px';
  input.style.height=Math.min(input.scrollHeight,120)+'px';
  sendBtn.disabled=busy||!input.value.trim();
}
input.addEventListener('input',resize);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.addEventListener('click',send);


const overlay      = document.getElementById('settings-overlay');
const sApikey      = document.getElementById('s-apikey');
const sModel       = document.getElementById('s-model');
const sSysprompt   = document.getElementById('s-sysprompt');
const spChars      = document.getElementById('sysprompt-chars');
const connDot      = document.getElementById('conn-dot');
const connLabel    = document.getElementById('conn-label');

const connError = document.getElementById('conn-error');
const connCopy  = document.getElementById('conn-copy');
function showConnError(txt) {
  connError.textContent = txt; connError.hidden = !txt; connCopy.hidden = !txt;
}
connCopy.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(connError.textContent); connCopy.textContent='Copied!'; setTimeout(()=>connCopy.textContent='Copy error',1500); } catch(e){}
});

async function autoTest(key, model) {
  showConnError('');
  if (!key) { connDot.className='conn-dot'; connLabel.textContent='Enter API key to connect'; return; }
  connDot.className='conn-dot busy'; connLabel.textContent='Connecting…';
  try {
    const t0=performance.now();
    await callAPI([{role:'user',content:'Hi'}], model||DEFAULT_MODEL, key, '');
    const ms=Math.round(performance.now()-t0);
    connDot.className='conn-dot ok';
    connLabel.textContent='Connected · '+ms+' ms';
  } catch(e) {
    connDot.className='conn-dot err';
    const m=e?.message||'';
    showConnError('error: ' + (e?.raw || (e?.name + ': ' + m)) + '\nmodel: ' + (model||DEFAULT_MODEL));
    if(m==='AUTH_ERROR')       connLabel.textContent='Auth failed — check your API key';
    else if(m==='RATE_LIMIT')  connLabel.textContent='Rate limited — wait and retry';
    else if(m.includes('fetch')||m.includes('Failed')) connLabel.textContent='Network error';
    else connLabel.textContent='Connection failed';
  }
}

let autoTestTimer=null;
function scheduleAutoTest() {
  clearTimeout(autoTestTimer);
  autoTestTimer=setTimeout(()=>{
    autoTest(sApikey.value.trim(), sModel.value.trim());
  }, 800);
}

function openSettings() {
  sApikey.value    = cfg.apiKey||'';
  sModel.value     = cfg.model||DEFAULT_MODEL;
  sSysprompt.value = cfg.sysprompt||DEFAULT_SYSPROMPT;
  updateSpChars();
  // Auto-test on open if key already saved
  if (cfg.apiKey) {
    autoTest(cfg.apiKey, cfg.model||DEFAULT_MODEL);
  } else {
    connDot.className='conn-dot'; connLabel.textContent='Enter API key to connect';
  }
  overlay.hidden=false;
  document.body.style.overflow='hidden';
}
function closeSettings() {
  overlay.hidden=true;
  document.body.style.overflow='';
}
function updateSpChars() {
  const n=sSysprompt.value.length;
  spChars.textContent=n.toLocaleString()+' chars';
  spChars.style.color=n>8000?'var(--danger)':'var(--muted)';
}

document.getElementById('settings-btn').addEventListener('click',openSettings);
document.getElementById('s-close-x').addEventListener('click',closeSettings);
document.getElementById('s-cancel').addEventListener('click',closeSettings);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSettings();});
sSysprompt.addEventListener('input',updateSpChars);

document.getElementById('s-save').addEventListener('click',()=>{
  cfg.apiKey    = sApikey.value.trim();
  cfg.model     = sModel.value.trim()||DEFAULT_MODEL;
  cfg.sysprompt = sSysprompt.value.trim()||DEFAULT_SYSPROMPT;
  saveCfg(); closeSettings();
});

// Upload .txt → system prompt
document.getElementById('upload-sysprompt-btn').addEventListener('click',()=>{
  document.getElementById('sysprompt-file').click();
});
document.getElementById('sysprompt-file').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ sSysprompt.value=ev.target.result; updateSpChars(); };
  reader.readAsText(file); e.target.value='';
});

// Auto-connect when API key or model changes
sApikey.addEventListener('input', scheduleAutoTest);
sModel.addEventListener('input', scheduleAutoTest);


function restoreSession() {
  const log = loadMsgLog();
  if (!log.length) return;

  // Rebuild API history from stored log
  history = loadApiHistory();

  // Re-render all stored messages in virtual-scroll aware fashion
  // We only add them to msgNodes (not to DOM yet) then show last 2 chunks
  const tempNodes = [];
  for (const entry of log) {
    if (entry.role==='user') {
      const d=document.createElement('div'); d.className='msg user'; d.textContent=entry.text;
      attachLongPress(d,entry.text); tempNodes.push(d);
    } else {
      const wrap=document.createElement('div'); wrap.className='ai-wrap';
      if (entry.type==='error') {
        const m=document.createElement('div'); m.className='msg err'; m.textContent=entry.text; wrap.appendChild(m);
      } else if (entry.type==='policy') {
        const m=document.createElement('div'); m.className='msg policy'; m.textContent=entry.text; wrap.appendChild(m);
      } else {
        wrap.appendChild(renderContent(entry.text));
        const row=document.createElement('div'); row.className='actions';
        const t=entry.text;
        row.appendChild(makeActionBtn('Copy',ICON.copy,'',async()=>{try{await navigator.clipboard.writeText(t);}catch(e){}}));
        const up=makeActionBtn('Good response',ICON.up,'',()=>{up.classList.toggle('on');down.classList.remove('on');});
        const down=makeActionBtn('Bad response',ICON.down,'',()=>{down.classList.toggle('on');up.classList.remove('on');});
        row.appendChild(up); row.appendChild(down);
        row.appendChild(makeActionBtn('Retry',ICON.retry,'full-only',retry));
        wrap.appendChild(row);
      }
      tempNodes.push(wrap);
    }
  }

  msgLog = log;
  msgNodes = tempNodes;

  // Show only last CHUNK*2 nodes in DOM; earlier ones are on-demand
  const startIdx = Math.max(0, tempNodes.length - CHUNK*2);
  visibleFrom = startIdx;
  for (let i=startIdx; i<tempNodes.length; i++) {
    chat.appendChild(tempNodes[i]);
  }
  if (visibleFrom > 0) sentinel.hidden=false;
  markLatest();
  chat.scrollTop=chat.scrollHeight;
}

restoreSession();
