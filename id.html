    <style>
      :root {
            --bg: #000;
            --text: #f7f5f2;
            --sub: #8d9098;
            --line: #2b2d32;
            --field: #0f1012;
            --accent: #D97757;
            --red: #ff5a6e;
            --cream: #F7F5F2;
            --sans: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        input,
        button {
            font-family: inherit;
        }

        input:focus,
        button:focus {
            outline: none;
        }

        .page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: #000;
            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 400px;
            max-height: calc(100% - 52px);
            overflow-y: auto;
            scrollbar-width: none;
            background: #131417;
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: clamp(14px, 3vh, 24px) 20px;
        }

        .card::-webkit-scrollbar {
            display: none;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .brand img {
            height: 36px;
            width: auto;
            display: block;
        }

        .brand span {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 36px;
            line-height: 1.12;
            text-align: center;
            margin: 0 0 10px;
        }

        .lead {
            text-align: center;
            color: var(--sub);
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cfcdca;
            margin: 0 0 8px 4px;
        }

        .box {
            display: flex;
            align-items: center;
            height: 54px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 16px;
            transition: border-color .15s;
        }

        .box:focus-within {
            border-color: var(--accent);
        }

        .box.bad {
            border-color: var(--red);
        }

        .box .at {
            padding-left: 18px;
            color: var(--accent);
            font-size: 17px;
            font-weight: 700;
        }

        .box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: transparent;
            border: 0;
            color: var(--text);
            font-size: 16px;
            font-weight: 500;
            padding: 0 18px;
            -webkit-user-select: text;
            user-select: text;
        }

        .box .at+input {
            padding-left: 4px;
        }

        .box input::placeholder {
            color: #565961;
        }

        .hint {
            font-size: 12px;
            line-height: 1.4;
            color: var(--sub);
            margin: 7px 4px 0;
        }

        .hint.err {
            color: var(--red);
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .consent {

        .consent a {

        .btn {

            touch-action: manipulation;

        .btn:active {
            transform: scale(.98);

        .btn[disabled] {
            opacity: .6;
            cursor: default;

        .shake {
            animation: shake .35s;

        @keyframes shake {

        .tick {
            display: flex;

            margin: clamp(8px, 1.8vh, 14px) 0 clamp(10px, 2vh, 14px);
            padding: 11px 14px;
            background: #0b0c0e;

            text-align: left;
        }

        .tick input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .tick .mark {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #26282d;
            display: flex;
            align-items: center;
            justify-content: center;

        .tick .mark svg {
            width: 13px;

            stroke: #fff;
            stroke-width: 3.2;

            stroke-linejoin: round;
            opacity: 0;

        .tick input:checked+.mark {
            background: var(--accent);
        }

        .tick input:checked+.mark svg {
            opacity: 1;
        }

        .tick .txt {
            font-size: 12.5px;

        }

        .tick .txt b {
            color: var(--text);

        .btn[disabled],
        .btn[disabled]:active {
            background: #25272c;
            color: #6a6d75;
            opacity: 1;
            transform: none;
            cursor: not-allowed;
        }

        .decline {
            display: block;
            width: 100%;
            background: none;
            border: 0;

            flex: 0 0 auto;

        .dlg {

        .dlg-card {

        .dlg-card h2 {

        .dlg-del {

        }

        }

        .hidden {
            display: none !important;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: clamp(42px, 6.4vh, 50px);
            padding: 0 16px;
            margin-bottom: 8px;
            background: #0b0c0e;
            border-radius: 16px;
            color: var(--text);

        }

        .link:active {

        }

        .link svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--sub);
            stroke-width: 2.2;
            stroke-linecap: round;

        @media (max-height: 680px) {
            .lead {
                display: none;
            }
        }

        @media (max-height: 560px) {
            .help {

        /* Responsive layout: phones, tablets, desktop and TV-sized displays */

        @media (min-width: 700px) {

        @media (min-width: 1200px) {
          .card { width: min(60vw, 560px); }

        }
        @media (max-height: 560px) {
          .page { justify-content: flex-start; }
          .card { margin: 8px auto; }
        }
    </style>
  </head>

    <script>
      const HOME = "https://gg-sun.in/";
        const LOGIN = "https://gg-sun.in/id";
        const DEVICE_DESTINATIONS = {
            desktop: "https://gg-sun.in/store/desktop",
            tablet: "https://gg-sun.in/store/tablet",
            mobile: "https://gg-sun.in/store/mobile"
        };
        const TEST_MODE = false;

        const $ = function(id) {
            return document.getElementById(id);
        };
        const elUser = $('username'),
            elNick = $('nickname'),
            btn = $('confirmBtn');

        $('logo').addEventListener('error', function() {
            this.style.display = 'none';
        });

        function showToast(m, ms) {
            const t = $('toast');
            t.textContent = m;
            t.classList.add('show');
            setTimeout(function() {
                t.classList.remove('show');
            }, ms || 3000);
        }

        function detectDeviceType() {
            const ua = navigator.userAgent || "";
            if (/SmartTV|Smart-TV|HbbTV|NetCast|WebOS.TV|Tizen.*TV|AppleTV|GoogleTV|Roku|AFTB|BRAVIA|Android TV/i.test(ua)) return "desktop";
            const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
            const small = Math.min(window.screen.width || innerWidth, window.screen.height || innerHeight);
            if (/iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (coarse && small >= 600 && small < 1100)) return "tablet";
            if (/Mobile|iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua) || small < 600) return "mobile";
            return "desktop";
        }
        const DEVICE_TYPE = detectDeviceType();
        function destinationForDevice() {
            return DEVICE_DESTINATIONS[DEVICE_TYPE] || DEVICE_DESTINATIONS.desktop;
        }
        let redirecting = false;
        function finishAndRedirect() {
            if (redirecting) return;
            redirecting = true;
            const overlay = $("redirectScreen");
            if (overlay) overlay.classList.add("show");
            setTimeout(function () { window.location.replace(destinationForDevice()); }, 2000);
        }

        function setState(boxId, hintId, msg, def) {
            $(boxId).classList.toggle('bad', !!msg);
            const h = $(hintId);
            h.classList.toggle('err', !!msg);
            h.textContent = msg || def;
        }

        const DEF_USER = '';
        const DEF_NICK = '';

        function checkUser(show) {
            const clean = elUser.value.toLowerCase().replace(/[^a-z0-9._]/g, '');
            if (clean !== elUser.value) elUser.value = clean;
            const v = clean;
            let msg = '';
            if (v.length < 3) msg = (show || v.length) ? 'At least 3 characters.' : '';
            else if (/^[._]|[._]$/.test(v)) msg = 'Cannot start or end with . or _';
            else if (/[._]{2}/.test(v)) msg = 'No two . or _ in a row.';
            const ok = v.length >= 3 && !msg;
            setState('boxUser', 'hintUser', (show || v.length) ? msg : '', DEF_USER);
            return ok;
        }

        function checkNick(show) {
            const v = elNick.value.trim();
            const ok = v.length >= 2;
            setState('boxNick', 'hintNick', (!ok && (show || elNick.value.length)) ? 'At least 2 characters.' : '', DEF_NICK);
            return ok;
        }

        elUser.addEventListener('input', function() {
            checkUser(false);
            refreshBtn();
        });
        elNick.addEventListener('input', function() {
            checkNick(false);
            refreshBtn();
        });

        // Supabase
        let sb = null;
        try {
            sb = supabase.createClient("https://sbzqevdfcujjkvsakrye.supabase.co", "sb_publishable_2hKEbnYliD_EP1CrwTuCAA_vg8jDFEH", {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true
                }
            });
        } catch (e) {
            sb = null;
        }

        function applyProfile(prof) {
            if (prof && prof.username && prof.terms_accepted_at && prof.age_13_plus) {
                finishAndRedirect();
                return;
            }
            if (prof && prof.username && prof.terms_accepted_at) goStep(3);
            else if (prof && prof.username) goStep(2);
            const md = (user && user.user_metadata) || {};
            if (prof && prof.nickname && !elNick.value) {
                elNick.value = prof.nickname;
                refreshBtn();
            } else if (md.full_name && !elNick.value) {
                elNick.value = String(md.full_name).split(' ')[0].slice(0, 24);
                refreshBtn();
            }
        }

        let user = null;
        if (sb && !TEST_MODE) {
            sb.auth.getSession().then(function(r) {
                const s = r && r.data && r.data.session;
                if (!s) {
                    location.replace(LOGIN);
                    return;
                }
                user = s.user;
                document.body.classList.remove("auth-pending");
                // Preserve the first onboarding timestamp across refreshes.
                sb.from("profile_onboarding_state").upsert({
                    user_id: user.id,
                    device_type: DEVICE_TYPE,
                    last_seen_at: new Date().toISOString()
                }, { onConflict: "user_id", ignoreDuplicates: false }).then(function () {});
                const md = user.user_metadata || {};
                sb.from('profiles').select('*').eq('id', user.id).maybeSingle().then(function(r) {
                    const prof = r && r.data;
                    if (!prof && md.username) {
                        // Users who finished the older metadata-only flow: copy their data into profiles once
                        const row = {
                            id: user.id,
                            username: md.username,
                            nickname: md.nickname || '',
                            google_data_consent: !!md.google_data_consent,
                            terms_accepted_at: md.terms_accepted_at || (md.terms_accepted ? new Date().toISOString() : null),
                            age_13_plus: !!md.age_13_plus,
                            age_confirmed_at: md.age_confirmed_at || null
                        };
                        return sb.from('profiles').upsert(row).then(function() {
                            applyProfile(row);
                        });
                    }
                    applyProfile(prof);
                }).catch(function() {});
            }).catch(function() {});
        }

        // Confirm stays disabled until username, nickname and the tick are all done
        function refreshBtn() {
            btn.disabled = !(checkUser(false) && checkNick(false) && $('gTick').checked);
        }
        $('gTick').addEventListener('change', refreshBtn);

        // Step switching (1 = profile, 2 = terms) inside this one page
        const step1 = $('form'),
            step2 = $('form2'),
            step3 = $('form3'),
            declineBtn = $('declineBtn');

        let curStep = 1;
        const DECLINE_LABELS = {
            1: "I don't want to create an account",
            2: "I don't accept",
            3: "I'm under 13"
        };

        function declineLabel() {
            return DECLINE_LABELS[curStep];
        }

        function goStep(n) {
            curStep = n;
            step1.classList.toggle('hidden', n !== 1);
            step2.classList.toggle('hidden', n !== 2);
            step3.classList.toggle('hidden', n !== 3);
            declineBtn.textContent = declineLabel();
        }

        const aTick = $('aTick'),
            acceptBtn = $('acceptBtn');
        aTick.addEventListener('change', function() {
            acceptBtn.disabled = !aTick.checked;
        });

        async function submitStep2() {
            if (acceptBtn.disabled) return;
            if (TEST_MODE) {
                goStep(3);
                return;
            }
            if (!sb || !user) {
                showToast('Please sign in again', 3500);
                setTimeout(function() {
                    location.replace(LOGIN);
                }, 1200);
                return;
            }
            acceptBtn.disabled = true;
            acceptBtn.textContent = 'Saving…';
            try {
                const res = await sb.from('profiles')
                    .update({ terms_accepted_at: new Date().toISOString(), device_type: DEVICE_TYPE })
                    .eq('id', user.id);
                if (res.error) throw res.error;
                acceptBtn.textContent = 'Accept & Continue';
                goStep(3);
            } catch (err) {
                showToast(((err && err.message) || 'Something went wrong').slice(0, 80), 4500);
                acceptBtn.textContent = 'Accept & Continue';
                acceptBtn.disabled = !aTick.checked;
            }
        }
        acceptBtn.addEventListener('click', submitStep2);
        step2.addEventListener('submit', function(e) {
            e.preventDefault();
        });

        // Step 3: 13+ age restriction
        const ageTick = $('ageTick'),
            ageBtn = $('ageBtn');
        ageTick.addEventListener('change', function() {
            ageBtn.disabled = !ageTick.checked;
        });

        async function submitStep3() {
            if (ageBtn.disabled) return;
            if (TEST_MODE) {
                showToast('TEST OK → all 3 steps done', 3500);
                return;
            }
            if (!sb || !user) {
                showToast('Please sign in again', 3500);
                setTimeout(function() {
                    location.replace(LOGIN);
                }, 1200);
                return;
            }
            ageBtn.disabled = true;
            ageBtn.textContent = 'Saving…';
            try {
                const res = await sb.from('profiles')
                    .update({ age_13_plus: true, age_confirmed_at: new Date().toISOString(), device_type: DEVICE_TYPE })
                    .eq('id', user.id);
                if (res.error) throw res.error;
                finishAndRedirect();
            } catch (err) {
                showToast(((err && err.message) || 'Something went wrong').slice(0, 80), 4500);
                ageBtn.textContent = 'Confirm & Finish';
                ageBtn.disabled = !ageTick.checked;
            }
        }
        ageBtn.addEventListener('click', submitStep3);
        step3.addEventListener('submit', function(e) {
            e.preventDefault();
        });

        // One-tap opt-out: delete this signed-in user's account and return to the homepage.
        $('declineBtn').addEventListener('click', async function() {
            const decline = this;
            if (TEST_MODE) { window.location.replace(HOME); return; }
            if (!sb || !user) { window.location.replace(LOGIN); return; }
            decline.disabled = true;
            btn.disabled = true;
            decline.textContent = 'Deleting account…';
            try {
                const r = await sb.rpc('delete_my_account');
                if (r.error) throw r.error;
                try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
                window.location.replace(HOME);
            } catch (err) {
                showToast(((err && err.message) || 'Could not delete account').slice(0, 100), 4500);
                decline.disabled = false;
                decline.textContent = "I don't want to create an account";
                refreshBtn();
            }
        });

        async function submitStep1() {
            if (btn.disabled) return;
            const a = checkUser(true),
                b = checkNick(true);
            const t = $('gTick').checked;
            $('tickRow').classList.toggle('bad', !t);
            if (!(a && b && t)) {
                btn.classList.remove('shake');
                void btn.offsetWidth;
                btn.classList.add('shake');
                showToast(t ? 'Please fix the highlighted fields' : 'Please tick the box to continue', 2500);
                return;
            }
            if (TEST_MODE) {
                goStep(2);
                return;
            }
            if (!sb || !user) {
                showToast('Please sign in again', 3500);
                setTimeout(function() {
                    location.replace(LOGIN);
                }, 1200);
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Saving…';
            try {
                const res = await sb.from('profiles').upsert({
                    id: user.id,
                    username: elUser.value,
                    nickname: elNick.value.trim(),
                    google_data_consent: true,
                    device_type: DEVICE_TYPE
                });
                if (res.error) {
                    if (res.error.code === '23505') throw new Error('Username already taken');
                    throw res.error;
                }
                btn.textContent = 'Confirm';
                goStep(2);
            } catch (err) {
                showToast(((err && err.message) || 'Something went wrong').slice(0, 80), 4500);
                btn.textContent = 'Confirm';
                refreshBtn();
            }
        }
        btn.addEventListener('click', submitStep1);
        step1.addEventListener('submit', function(e) {
            e.preventDefault();
        });
        [elUser, elNick].forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitStep1();
                }
            });
        });
        ['logo'].forEach(function(id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            el.addEventListener('dragstart', function(e) { e.preventDefault(); });
        });
    </script>
  </body>
</html>
