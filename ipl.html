<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Access - Strategy Session</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .execution-container {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        .execution-container h2 {
            margin-top: 0;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .submit-btn:hover {
            background: #2ea043;
        }
        #status-message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="execution-container">
        <h2>Initiate Protocol</h2>
        <form id="leadForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="submit-btn">Execute Setup</button>
        </form>
        <div id="status-message"></div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevents page reload

            const submitBtn = document.querySelector('.submit-btn');
            const statusMessage = document.getElementById('status-message');
            
            // DHYAN DEIN: Yahan Apna N8N Webhook Test URL daalna mat bhoolna
            const webhookUrl = 'YOUR_N8N_WEBHOOK_URL_HERE';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };

            submitBtn.textContent = 'Processing...';
            statusMessage.textContent = '';
            statusMessage.style.color = '#c9d1d9';

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                submitBtn.textContent = 'Setup Executed';
                submitBtn.style.background = '#1f6feb';
                statusMessage.textContent = 'Data successfully transmitted to the backend vault.';
                statusMessage.style.color = '#58a6ff';
                document.getElementById('leadForm').reset();
            })
            .catch(error => {
                submitBtn.textContent = 'Execute Setup';
                submitBtn.style.background = '#238636'; // Resetting button color
                statusMessage.textContent = 'Transmission failed. Verify webhook URL or CORS settings.';
                statusMessage.style.color = '#f85149';
                console.error('Submission Error:', error);
            });
        });
    </script>

</body>
</html>
