  <body>

              <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>

    <div class="toast" id="toast"></div>

    <script>
      var SUPA_URL = 'https://sbzqevdfcujjkvsakrye.supabase.co';
      var SUPA_KEY = 'sb_publishable_2hKEbnYliD_EP1CrwTuCAA_vg8jDFEH';
      var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

      // Redirect only after the session is verified against Supabase.
      // getSession() alone can return a stale token stored in this browser.
      var sessionCheckRunning = false;
      async function verifySessionAndRedirect() {
        if (sessionCheckRunning) return;
        sessionCheckRunning = true;
        try {
          var sessionResult = await sb.auth.getSession();
          var session = sessionResult && sessionResult.data && sessionResult.data.session;
          if (!session) return;

          var userResult = await sb.auth.getUser();
          if (userResult.error || !userResult.data || !userResult.data.user) {
            // Clear only this browser's stale session; do not delete the account.
            await sb.auth.signOut({ scope: 'local' });
            return;
          }
          window.location.replace('https://gg-sun.in/id');
        } catch (e) {
          // If verification fails because of a network issue, leave the sign-in page visible.
        } finally {
          sessionCheckRunning = false;
        }
      }

      verifySessionAndRedirect();
      sb.auth.onAuthStateChange(function (event, session) {
        if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
          setTimeout(verifySessionAndRedirect, 0);
        }
      });

      (function () {
        var logoEl = document.getElementById('logoMedia');
        var heroEl = document.getElementById('heroMedia');
        var loaded = 0;

        function onLoad() {
          loaded++;
          if (loaded >= 2) document.documentElement.classList.add('ready');
        }

        var logoImg = new Image();
        logoImg.src = 'https://gg-sun.in/tozyer/ele/ele2.png';
        logoImg.alt = 'Twozyer';
        logoImg.draggable = false;
        logoImg.onload = onLoad;
        logoImg.onerror = onLoad;
        logoEl.appendChild(logoImg);

        var heroImg = new Image();
        heroImg.src = 'https://gg-sun.in/tozyer/ele/ele1.gif';
        heroImg.alt = '';
        heroImg.draggable = false;
        heroImg.onload = onLoad;
        heroImg.onerror = onLoad;
        heroEl.appendChild(heroImg);
      })();

      (function () {
        var banner = document.getElementById('networkBanner');
        function update() {
          if (navigator.onLine) {
            banner.classList.remove('show');
          } else {
            banner.classList.add('show');
          }
        }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
      })();

      var toastEl = document.getElementById('toast');
      var toastTimer;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2800);
      }

      var isLoading = false;

      function setLoading(val) {
        isLoading = val;
        var btn = document.getElementById('googleSigninBtn');
        if (val) {
          btn.classList.add('loading');
          history.pushState({ twozyerAuth: true }, '');
        } else {
          btn.classList.remove('loading');
        }
      }

      window.addEventListener('popstate', function () {
        if (isLoading) {
          setLoading(false);
          showToast('Sign-in cancelled');
        }
      });

      document.getElementById('googleSigninBtn').addEventListener('click', function () {
        if (isLoading) return;
        if (!navigator.onLine) {
          showToast('No internet connection');
          return;
        }
        setLoading(true);
        sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: 'https://gg-sun.in/id' }
        }).then(function (res) {
          if (res.error) {
            setLoading(false);
            showToast('Sign-in failed. Try again.');
          }
        });
      });
    </script>
  </body>
</html>
