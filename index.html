<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tozyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #000000;
            --accent: #D97757;
            --text: #F7F5F2;
            --muted: rgba(247, 245, 242, 0.55);
            --input-bg: #0C0C0C;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; height: 100%; background: var(--bg); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        .screen {
            min-height: 100vh;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 44px 28px 36px;
        }

        .hidden { display: none !important; }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 36px;
        }

        .logo img { height: 52px; width: auto; object-fit: contain; display: block; }

        .logo span {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .illustration { margin: 8px 0 36px; pointer-events: none; }
        .illustration img { max-width: 220px; height: auto; }

        h1 {
            font-family: 'Newsreader', Georgia, serif;
            font-weight: 400;
            font-size: 34px;
            line-height: 1.18;
            margin: 0;
        }

        .spacer { flex: 1; min-height: 32px; }

        .bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* Custom-styled Google button: a real button that triggers
           google.accounts.id.prompt() directly -- no iframe overlay,
           no popup-window quirks on mobile browsers. */
        .google-btn {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #F7F5F2;
            color: #1a1a1a;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-btn:active { opacity: 0.8; }

        .terms { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 4px 0 0; }
        .terms a { color: var(--text); text-decoration: underline; }

        /* --- Signed-in view --- */
        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid var(--accent);
        }

        .user-name {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 26px;
            margin: 0 0 4px;
        }

        .user-email { color: var(--muted); font-size: 14px; margin: 0 0 40px; }

        .logout-btn {
            width: 100%;
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--accent);
            border-radius: 999px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:active { opacity: 0.75; }
    </style>
</head>

<body>

    <!-- SIGN IN / SIGN UP SCREEN -->
    <div class="screen" id="authView">
        <div class="logo">
            <img src="icon_id_1.png" alt="Tozyer Logo">
            <span>Tozyer</span>
        </div>

        <div class="illustration">
            <img src="favicon.png" alt="Illustration">
        </div>

        <h1>Welcome to<br>Tozyer</h1>

        <div class="spacer"></div>

        <div class="bottom">
            <button class="google-btn" id="googleSigninBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z" />
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z" />
                    <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z" />
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z" />
                </svg>
                Continue with Google
            </button>
            <p class="terms">
                By continuing, you agree to Tozyer's
                <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>.
            </p>
        </div>
    </div>

    <!-- SIGNED-IN / APP SCREEN -->
    <div class="screen hidden" id="appView">
        <div class="logo">
            <img src="icon_id_1.png" alt="Tozyer Logo">
            <span>Tozyer</span>
        </div>

        <div class="spacer"></div>

        <img class="avatar" id="userAvatar" src="" alt="">
        <p class="user-name" id="userName"></p>
        <p class="user-email" id="userEmail"></p>

        <div class="spacer"></div>

        <div class="bottom">
            <button class="logout-btn" id="logoutBtn">Log out</button>
        </div>
    </div>

    <script>
        // Public identifiers — safe to expose in the browser.
        const GOOGLE_CLIENT_ID = "929415774330-hhv0f219fpsagpnmpm2v25p9g0fv9839.apps.googleusercontent.com";
        const SUPABASE_URL = "https://jyteqldlhfpaolqlulaq.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2NNB76fsDQsJFY9u1rbZSA_RVDJkuom";
        // The secret key is intentionally NOT here. It belongs on a server only.

        // In-memory storage adapter so Supabase doesn't touch localStorage.
        // Session resets on page reload -- expected for this static page.
        const memoryStorage = (() => {
            let store = {};
            return {
                getItem: (k) => (k in store ? store[k] : null),
                setItem: (k, v) => { store[k] = v; },
                removeItem: (k) => { delete store[k]; }
            };
        })();

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { storage: memoryStorage, persistSession: false, autoRefreshToken: false }
        });

        let currentUser = null;

        function parseJwt(token) {
            const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const json = decodeURIComponent(
                atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
            );
            return JSON.parse(json);
        }

        async function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);

            // Hand the Google ID token to Supabase Auth -- this creates/logs in
            // the matching Supabase user. Requires Google enabled as a provider
            // in the Supabase dashboard (see setup notes).
            const { data, error } = await db.auth.signInWithIdToken({
                provider: 'google',
                token: response.credential
            });

            if (error) {
                alert('Sign-in failed: ' + error.message);
                console.error(error);
                return;
            }

            currentUser = {
                id: data.user.id,
                name: payload.name,
                email: payload.email,
                picture: payload.picture
            };

            await db.from('profiles').upsert({
                id: currentUser.id,
                email: currentUser.email,
                name: currentUser.name,
                avatar_url: currentUser.picture
            });

            showApp();
        }

        function showApp() {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('appView').classList.remove('hidden');
            document.getElementById('userAvatar').src = currentUser.picture;
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userEmail').textContent = currentUser.email;
        }

        function showAuth() {
            document.getElementById('appView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
        }

        async function logout() {
            await db.auth.signOut();
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.disableAutoSelect();
            }
            currentUser = null;
            showAuth();
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false
            });

            // Our own real button -- no hidden Google iframe, no popup
            // window, so nothing can strand the page on a Google URL.
            document.getElementById('googleSigninBtn').addEventListener('click', () => {
                google.accounts.id.prompt();
            });

            document.getElementById('logoutBtn').addEventListener('click', logout);
        };
    </script>
</body>

</html>
