<style>
        :root {
            --bg: #0e0f12;
            --card: #1a1c20;
            --text: #f2f2f2;
            --sub: #9a9ea6;
            --green: #20c97a;
            --red: #f6465d;
            --border: #2a2d33;
            --muted: #9a9ea6;
            --accent: #20c97a;
            --navh: 66px;
            --surface: #18181c;
            --surface2: #212126;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        button:focus,
        input:focus {
            outline: none;
        }

        #networkBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #f6465d;
            color: #fff;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 0;
            z-index: 100000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            padding-top: env(safe-area-inset-top, 10px);
        }

        #networkBanner.show {
            transform: translateY(0);
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            overflow-y: auto;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 44px 28px calc(36px + env(safe-area-inset-bottom, 0px));
            background: #000;
            z-index: 50;
        }

        .hidden {
            display: none !important;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 36px;
        }

        .logo img {
            height: 52px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .logo span {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .illustration {
            margin: 8px 0 36px;
            pointer-events: none;
        }

        .illustration img {
            max-width: 220px;
            height: auto;
        }

        #logoMedia {
            display: flex;
            align-items: center;
        }

        #logoMedia:empty,
        #heroMedia:empty {
            display: none;
        }

        #logoMedia img,
        #logoMedia video {
            height: 52px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .illustration {
            width: 100%;
        }

        #heroMedia {
            display: flex;
            justify-content: center;
            width: 100%;
            margin: 0 auto;
        }

        #heroMedia img,
        #heroMedia video {
            width: 100%;
            max-width: none;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        #heroMedia iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 12px;
            display: block;
        }

        .auth-title {
            font-family: 'Newsreader', Georgia, serif;
            font-weight: 400;
            font-size: 34px;
            line-height: 1.18;
            margin: 0;
        }

        .spacer {
            flex: 1;
            min-height: 32px;
        }

        .bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .google-btn {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #F7F5F2;
            color: #1a1a1a;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-btn:active {
            opacity: 0.8;
        }

        .terms {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(247, 245, 242, 0.55);
            margin: 4px auto 0;
            max-width: 320px;
            text-align: center;
            text-wrap: balance;
        }

        .terms a {
            color: #F7F5F2;
            text-decoration: underline;
            white-space: nowrap;
        }

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- Responsive: mobile + desktop ---------- */
@media (hover:hover) {
    .google-btn { transition: opacity .15s, transform .15s; }
    .google-btn:hover { opacity: .92; transform: translateY(-1px); }
    .terms a:hover { opacity: .8; }
}

/* Short phones / landscape */
@media (max-height: 640px) {
    .screen { padding-top: 24px; }
    .logo { margin-bottom: 20px; }
    .illustration { margin-bottom: 20px; }
    .auth-title { font-size: 28px; }
}

/* Full screen on every device */
.screen {
    max-width: none;
    width: 100%;
    height: 100%;
    margin: 0;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    transform: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
}
.illustration,
.bottom {
    max-width: 460px;
}

/* Tablet + desktop: same full screen, just roomier */
@media (min-width: 768px) {
    .screen { padding: 56px 44px 44px; }
    .auth-title { font-size: 40px; }
    .google-btn { cursor: pointer; }
}

/* Desktop / laptop / TV: full-screen split layout */
@media (min-width: 1024px) {
    .screen {
        padding: 48px 6vw;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr 1fr;
        grid-template-areas:
            "logo logo"
            "hero title"
            "hero bottom";
        column-gap: 6vw;
        align-items: stretch;
        text-align: left;
    }
    .logo { grid-area: logo; justify-content: flex-start; margin: 0; }
    .illustration { grid-area: hero; align-self: center; margin: 0; max-width: none; }
    #heroMedia { max-width: min(100%, 760px) !important; margin: 0 auto; }
    .auth-title {
        grid-area: title;
        align-self: end;
        font-size: clamp(44px, 4.6vw, 96px);
        padding-bottom: 28px;
    }
    .spacer { display: none; }
    .bottom {
        grid-area: bottom;
        align-self: start;
        align-items: flex-start;
        max-width: 440px;
        width: 100%;
    }
    .terms { margin: 4px 0 0; text-align: left; max-width: 440px; }
}

/* Large TVs / 4K */
@media (min-width: 1700px) {
    .screen { padding: 64px 7vw; }
    .logo span { font-size: 44px; }
    #logoMedia img, #logoMedia video { height: 84px !important; }
    .google-btn { height: 68px; font-size: 22px; gap: 14px; }
    .google-btn svg { width: 24px; height: 24px; }
    .bottom, .terms { max-width: 560px; }
    .terms { font-size: 17px; }
}
</style>
</head>
<body>
    <div class="screen" id="authScreen">
        <div class="logo">
            <div id="logoMedia"></div>
            <span>Twozyer</span>
        </div>

        <div class="illustration">
            <div id="heroMedia"></div>
        </div>

        <h1 class="auth-title">Welcome to<br>Twozyer</h1>

        <div class="spacer"></div>

        <div class="bottom">
            <button class="google-btn" id="googleSigninBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z" />
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z" />
                    <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z" />
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z" />
                </svg>
                Continue with Google
            </button>
            <p class="terms">
                By continuing, you agree to Twozyer's
                <a href="https://gg-sun.in/illegal/terms" target="_blank" rel="noopener">Terms of Service</a> and
                <a href="https://gg-sun.in/illegal/privacy" target="_blank" rel="noopener">Privacy Policy</a>.
            </p>
        </div>
    </div>

<div class="toast" id="toast"></div>
<script>
const LOGO_URL = "https://gg-sun.in/tozyer/ele/ele2.png";
const LOGO_HEIGHT = 64;
const HERO_URL = "https://gg-sun.in/tozyer/ele/ele1.gif";
const HERO_MAX_WIDTH = 340;
        function mediaKind(url) {
            if (/^(https?:\/\/)?(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)\//i.test(url)) return 'youtube';
            if (/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return 'video';
            return 'image';
        }

        function youtubeId(url) {
            const m = url.match(/(?:youtu\.be\/|shorts\/|embed\/|[?&]v=)([A-Za-z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function renderMedia(box, url, height, maxWidth) {
            if (!box) return;
            box.innerHTML = '';
            url = (url || '').trim();
            if (!url) return;
            if (/^\s*(javascript|vbscript):/i.test(url)) return;
            if (url.indexOf('data:') === 0 && !/^data:(image|video)\//i.test(url)) return;
            const kind = mediaKind(url);
            let el;
            if (kind === 'youtube') {
                const id = youtubeId(url);
                if (!id) return;
                el = document.createElement('iframe');
                el.src = 'https://www.youtube-nocookie.com/embed/' + id +
                    '?autoplay=1&mute=1&loop=1&controls=0&playsinline=1&modestbranding=1&playlist=' + id;
                el.allow = 'autoplay; encrypted-media';
                el.setAttribute('loading', 'lazy');
                el.style.pointerEvents = 'none';
            } else if (kind === 'video') {
                el = document.createElement('video');
                el.src = url;
                el.autoplay = true;
                el.muted = true;
                el.loop = true;
                el.playsInline = true;
                el.setAttribute('playsinline', '');
                el.setAttribute('muted', '');
                el.preload = 'auto';
                el.addEventListener('error', function() {
                    box.innerHTML = '';
                });
                el.addEventListener('canplay', function() {
                    el.play().catch(function() {});
                });
            } else {
                el = document.createElement('img');
                el.src = url;
                el.alt = '';
                el.decoding = 'async';
                el.addEventListener('error', function() {
                    box.innerHTML = '';
                });
            }
            if (height) {
                el.style.height = height + 'px';
                if (kind !== 'youtube') el.style.width = 'auto';
            }
            if (maxWidth) box.style.maxWidth = maxWidth + 'px';
            box.appendChild(el);
        }

        renderMedia(document.getElementById('logoMedia'), LOGO_URL, LOGO_HEIGHT, 0);
        renderMedia(document.getElementById('heroMedia'), HERO_URL, 0, HERO_MAX_WIDTH);
renderMedia(document.getElementById('logoMedia'), LOGO_URL, LOGO_HEIGHT, 0);
renderMedia(document.getElementById('heroMedia'), HERO_URL, 0, HERO_MAX_WIDTH);

function showToast(m, ms) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, ms || 2500);
}

function makePageBlackAndRedirect(appUrl) {
    document.body.innerHTML = '';
    document.body.style.backgroundColor = '#000000';
    document.body.style.backgroundImage = 'none';
    location.replace(appUrl);
}

const sb = supabase.createClient("https://qwdbapckawxkqrrwxusm.supabase.co", "sb_publishable_xcp3SZkduNreKLsqe_kE4g_CxPNKbRW", {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
const APP = "https://gg-sun.in/store";

sb.auth.getSession().then(function(r) { if (r.data.session) makePageBlackAndRedirect(APP); });
sb.auth.onAuthStateChange(function(e, s) { if (s) makePageBlackAndRedirect(APP); });

const googleBtn = document.getElementById('googleSigninBtn');
googleBtn.addEventListener('click', async function() {
    googleBtn.disabled = true;
    try {
        const res = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: APP, queryParams: { prompt: 'select_account' } }
        });
        if (res.error) {
            showToast((res.error.message || 'Login failed').slice(0, 60), 5000);
            googleBtn.disabled = false;
        }
    } catch (e) {
        showToast('Login failed, try again', 4000);
        googleBtn.disabled = false;
    }
});
</script>
</body>
