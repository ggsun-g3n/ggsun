                        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z" />
                        <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z" />
                        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z" />

    <script>
        const LOGO_URL = "https://gg-sun.in/tozyer/ele/ele2.png";
        const LOGO_HEIGHT = 64;
        const HERO_URL = "https://gg-sun.in/tozyer/ele/ele1.gif";
        const HERO_MAX_WIDTH = 440;

        function mediaKind(url) {
            if (/^(https?:\/\/)?(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)\//i.test(url)) return 'youtube';
            if (/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return 'video';
            return 'image';
        }

        function youtubeId(url) {
            const m = url.match(/(?:youtu\.be\/|shorts\/|embed\/|[?&]v=)([A-Za-z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function renderMedia(box, url, height, maxWidth) {
            if (!box) return;
            box.innerHTML = '';
            url = (url || '').trim();
            if (!url) return;
            if (/^\s*(javascript|vbscript):/i.test(url)) return;
            if (url.indexOf('data:') === 0 && !/^data:(image|video)\//i.test(url)) return;
            const kind = mediaKind(url);
            let el;
            if (kind === 'youtube') {
                const id = youtubeId(url);
                if (!id) return;
                el = document.createElement('iframe');
                el.src = 'https://www.youtube-nocookie.com/embed/' + id +
                    '?autoplay=1&mute=1&loop=1&controls=0&playsinline=1&modestbranding=1&playlist=' + id;
                el.allow = 'autoplay; encrypted-media';
                el.setAttribute('loading', 'lazy');
                el.style.pointerEvents = 'none';
            } else if (kind === 'video') {
                el = document.createElement('video');
                el.src = url;
                el.autoplay = true;
                el.muted = true;
                el.loop = true;
                el.playsInline = true;
                el.setAttribute('playsinline', '');
                el.setAttribute('muted', '');
                el.preload = 'auto';
                el.addEventListener('error', function() {
                    box.innerHTML = '';
                });
                el.addEventListener('canplay', function() {
                    el.play().catch(function() {});
                });
            } else {
                el = document.createElement('img');
                el.src = url;
                el.alt = '';
                el.decoding = 'async';
                el.addEventListener('error', function() {
                    box.innerHTML = '';
                });
            }
            if (height) {
                el.style.height = height + 'px';
                if (kind !== 'youtube') el.style.width = 'auto';
            }
            if (maxWidth) box.style.maxWidth = maxWidth + 'px';
            box.appendChild(el);
        }

        function wait(ms) {
            return new Promise(function(r) {
                setTimeout(r, ms);
            });
        }

        function preloadMedia(url) {
            url = (url || '').trim();
            if (!url) return Promise.resolve('');
            const kind = mediaKind(url);
            if (kind === 'youtube') return Promise.resolve(url);
            const isData = url.indexOf('data:') === 0;

            function attempt(n) {
                const u = (n === 0 || isData) ? url : url + (url.indexOf('?') > -1 ? '&' : '?') + '_r=' + n;
                return new Promise(function(resolve) {
                    let done = false;
                    const finish = function(ok) {
                        if (done) return;
                        done = true;
                        resolve(ok ? u : null);
                    };
                    const timer = setTimeout(function() {
                        finish(false);
                    }, 8000);
                    if (kind === 'video') {
                        const v = document.createElement('video');
                        v.preload = 'auto';
                        v.muted = true;
                        v.addEventListener('loadeddata', function() {
                            clearTimeout(timer);
                            finish(true);
                        });
                        v.addEventListener('error', function() {
                            clearTimeout(timer);
                            finish(false);
                        });
                        v.src = u;
                    } else {
                        const im = new Image();
                        im.onload = function() {
                            clearTimeout(timer);
                            if (im.decode) im.decode().then(function() {
                                finish(true);
                            }, function() {
                                finish(true);
                            });
                            else finish(true);
                        };
                        im.onerror = function() {
                            clearTimeout(timer);
                            finish(false);
                        };
                        im.src = u;
                    }
                }).then(function(res) {
                    if (res) return res;
                    if (n < 2 && !isData) return wait(400 * (n + 1)).then(function() {
                        return attempt(n + 1);
                    });
                    return '';
                });
            }
            return attempt(0);
        }
