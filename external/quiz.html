<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quiz</title>
<style>
:root{--bg:#0b0d14;--card:#151926;--line:#2a3045;--tx:#e8ebf5;--mut:#8b93ad;--ac:#7c5cff;--ok:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.center{justify-content:center;align-items:center;text-align:center;gap:14px}
h1{font-size:clamp(22px,6vw,30px)}
.mut{color:var(--mut);font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;text-align:center;outline:none}
input:focus{border-color:var(--ac)}
button{font:inherit;color:var(--tx);cursor:pointer}
.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);font-size:17px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.qa{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;font-size:16px}
.title{color:var(--ac);font-weight:600;font-size:.85em}
.q{font-weight:600;line-height:1.35;font-size:1.05em}
.opts{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.opt{flex:1;min-height:0;display:flex;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:.92em;line-height:1.35;transition:.15s}
.opt.ok{border-color:var(--ok);background:#12301f}
.opt.no{border-color:var(--no);background:#3a1416}
.opt:disabled{cursor:default}
.big{font-size:clamp(54px,18vw,84px);font-weight:800;line-height:1}
.msg{font-size:16px;line-height:1.4;max-width:34ch}
.row{display:flex;gap:10px;width:100%}
.row button{flex:1}
.sec{background:var(--card);border:1px solid var(--line)}
#s-name{position:relative;overflow:hidden;border-radius:26px;padding:16px;gap:clamp(6px,1.6vh,14px);background:linear-gradient(160deg,#ffe3f1 0%,#e6dcff 50%,#d3f1ff 100%);color:#5a3a5e}
#s-name>*:not(.dc){position:relative;z-index:2}
.dc{position:absolute;z-index:1;pointer-events:none;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.cat{width:clamp(80px,22vh,150px);height:auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eyes{transform-origin:60px 60px;animation:bl 4s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#s-name .hi{font-size:clamp(26px,7vw,34px);color:#7a3d7e}
#s-name .sub{font-size:18px;font-weight:600;color:#8a5a8e}
#s-name input{background:#fff;border:3px solid #ffb3d1;color:#5a3a5e;border-radius:999px;box-shadow:0 6px 0 #f3c5da;max-width:340px}
#s-name input::placeholder{color:#c7a6c9}
#s-name input:focus{border-color:#a78bfa}
.cute{background:linear-gradient(135deg,#ff7eb6,#a78bfa);border-radius:999px;max-width:340px;box-shadow:0 6px 0 #d45f97;color:#fff}
.cute:active{transform:translateY(4px);box-shadow:0 2px 0 #d45f97}
.bs2{font-size:14px;font-weight:600;color:#8a5a8e;min-height:18px}
html,body{overscroll-behavior:none;touch-action:manipulation;position:fixed;inset:0;width:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
svg.dc{display:block}

#s-quiz,#s-end{position:relative;overflow:hidden;border-radius:26px;padding:14px;background:var(--qbg,linear-gradient(160deg,#ffe3f1,#e6dcff));color:#4a3350;transition:background .4s}
#s-quiz>*:not(.dc),#s-end>*:not(.dc){position:relative;z-index:2}
#s-quiz .top{background:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px;color:#6b4a73;font-weight:700}
#s-quiz .bar{background:rgba(255,255,255,.8);height:8px;border-radius:99px}
#s-quiz .bar i{background:var(--acc,#ff7eb6);border-radius:99px}
#s-quiz .qa{justify-content:center;gap:12px;padding:0 2px}
.qcard{background:#fff;border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px}
#s-quiz .title{align-self:flex-start;background:var(--acc,#ff7eb6);color:#fff;padding:3px 11px;border-radius:999px;font-size:.78em;font-weight:700}
#s-quiz .q{color:#4a3350;font-size:1em}
#s-quiz .opts{flex:none;gap:9px}
#s-quiz .opt{flex:none;gap:9px;padding:7px 10px;background:#fff;border:2px solid #fff;color:#4a3350;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.08);font-size:.84em}
.lt{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc,#ff7eb6);color:#fff;font-weight:700;font-size:.9em;display:flex;align-items:center;justify-content:center}
#s-quiz .opt.ok{background:#d9f7e4;border-color:#22c55e}
#s-quiz .opt.no{background:#ffe0e3;border-color:#ef4444}
#s-quiz .opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
#s-end{gap:clamp(6px,1.6vh,14px)}
#s-end .mut,#s-end .msg{color:#6b4a73;font-weight:600}
#s-end .big{color:var(--acc,#ff7eb6);text-shadow:0 5px 0 rgba(0,0,0,.08)}
#s-end .msg{background:#fff;padding:10px 14px;border-radius:16px}
.cute.sec2{background:#fff;color:#7a3d7e;box-shadow:0 6px 0 #e0cbe8}
</style>
</head>

<script>
const D=[
["Samaj Aur Bheed","Jab main bahar nikalta hoon aur charo taraf logon ka shor, bheed aur unki normal life dekhta hoon—toh mere dimaag mein sabse pehla khayal kya aata hai?","Ek ajeeb si irritation hoti hai—yeh sab mujhe ek nakli aur khokhla loop lagta hai, aur main bas wahan se nikalkar apne akelepan mein wapas aana chahta hoon.","Lagta hai ki kaash main bhi inke sath mix ho paun aur thoda normal feel karun."],
["Meethe Ki Talab","Agar mere samne koi bahut accha khana ya mera so-called 'favourite' dessert rakh de—toh naturally mera reaction kaisa hota hai?","Mera system usme koi interest nahi leta—mere liye khana bas body ko zinda rakhne ka fuel hai, swaad ya 'comfort' jaisi cheez mere dimaag mein register hi nahi hoti.","Main thoda excite ho jata hoon—aakhir taste aur comfort sabko accha lagta hai."],
["Vegan Framework","Diet aur khane-peene ke rules ko lekar meri approach exactly kya hai?","Main kisi label ya rulebook ke hisaab se nahi chalta—mera focus bas is baat par hai ki meri physical limit aur survival ke liye kya zaroori hai.","Main society ke kuch strict ethical rules follow karta hoon—jaise animal products poori tarah avoid karna."],
["Physical Reality (Athlete Identity)","Meri physical conditioning aur training ke peeche ka asli sach kya hai—kya main bas random workout karne wala banda hoon?","Main ek dedicated athlete hoon—apni physical body ko har din extreme limits tak push karna aur intense discipline maintain karna mera lifestyle hai.","Main bas fitness maintain karne ke liye casual exercise kar leta hoon—koi intense athletic routine nahi hai."],
["Internal Belief System (Nastikta)","Bhagwan, kismat aur dharmic vishwas ko lekar meri internal mindset kya kehti hai?","Main ek pakka nastik (atheist) hoon—mere liye koi higher power ya kismat exist nahi karti, duniya sirf pure logic, cause-and-effect aur human actions se chalti hai.","Main bhagwan par bharosa rakhta hoon—aur mushkil waqt mein unse koi na koi miracle ki umeed karta hoon."],
["Rishton Ki Haqeeqat","Meri life mein aane wale logon aur in 'doston' ki actual jagah kya hai?","Woh bas temporary variables hain—ek data stream ki tarah, jinki ek expiry date hai aur jo kabhi bhi mere system se replace ya delete ho sakte hain.","Woh log mere safar ka ek zaroori hissa hain—jinke bina long-term survive karna mushkil hai."],
["Unspoken Love Life","Jis insaan ko main andar se bahut pasand karta tha—uske sath mera real-life connection kaisa raha?","Maine unse ek baar bhi baat nahi ki—main hamesha door se bas silent observer bana raha, apni feelings ko andar hi dabaye rakha aur zero communication rakha.","Maine aage badhkar unse baat ki, apni feelings express ki aur ek rishta banane ki koshish ki."],
["Moral Guilt","Jab main apne fayde ya kisi maqsad ke liye koi aisa step leta hoon jo society ki nazron mein galat hai—toh baad mein kaisa feel karta hoon?","Guilt naam ka code mere system mein hai hi nahi—jo step logic aur calculation ke hisaab se sahi tha, bas wahi matter karta hai; baki sab illusion hai.","Kahi na kahi ek guilt hota hai ki shayad maine apne usoolon ke khilaf kuch kar diya."],
["Deep Personal Truth","Jab Sandeep ka zikr aata hai ya woh mere dimaag mein aate hain—toh meri actual feelings kya hoti hain?","Main Sandeep se sach mein pyar karta hoon—chahe mera exterior kitna bhi cold ya dark kyun na ho, yeh feeling mera ek absolute truth hai.","Woh bas ek normal jaan-pehchan wale insaan hain—unke liye mere andar koi deep emotion nahi hai."],
["The Mind-Bending Love Paradox","Jab main 'pyaar' ke peeche ki psychology aur human logic ko dissect karta hoon—toh kaun sa sawal poora dimaag ghuma deta hai?","\"Tum kisi ko isliye pyar karte ho kyunki woh tumse karta hai—toh usne kya sochkar tumse pyar kiya tha? Ki yeh ek handsome ladka hai?\"—Yeh poora loop superficial attraction aur mutual illusion ka ek endless trap hai.","Pyaar bilkul selfless aur pure hota hai—isme koi condition ya calculation nahi hoti."]
];
const $=id=>document.getElementById(id);
let name="",i=0,score=0,lock=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function fit(){const qa=$('qa');let f=17;qa.style.fontSize=f+'px';while(qa.scrollHeight>qa.clientHeight+1&&f>9){f-=.5;qa.style.fontSize=f+'px'}}
function best(){const b=store.get('quiz_best_'+name.toLowerCase());return b===null?null:+b}
function start(){name=$('nm').value.trim();if(!name){$('nm').focus();$('nm').style.borderColor='var(--no)';return}
 store.set('quiz_name',name);i=0;score=0;$('who').textContent=name;show('s-quiz');load()}
const PL=[['#ff7eb6','#ffe3f1','#e6dcff'],['#a78bfa','#e6dcff','#d3f1ff'],['#2fb985','#d8f8e8','#d3f1ff'],['#ff9f5a','#ffe9d1','#ffe3f1'],['#4da3ff','#d3ecff','#e6dcff'],['#ef6aa0','#ffd9e8','#fff1c9'],['#8b7bff','#e0dcff','#ffd9e8'],['#e8a317','#fff1c9','#ffe3f1'],['#ff6b8b','#ffd9e2','#e6dcff'],['#2fbfbf','#d0f5f3','#e6dcff']];
function theme(n){const c=PL[n%PL.length],r=document.documentElement.style;r.setProperty('--acc',c[0]);r.setProperty('--qbg','linear-gradient(160deg,'+c[1]+','+c[2]+')')}
function load(){lock=false;const d=D[i];theme(i);$('cnt').textContent=(i+1)+'/'+D.length;$('sc').textContent='Score: '+score;$('pg').style.width=(i/D.length*100)+'%';
 $('tt').textContent='Quiz '+(i+1)+': '+d[0];$('qq').textContent=d[1];
 const o=[{t:d[2],c:1},{t:d[3],c:0}];if(Math.random()<.5)o.reverse();
 const box=$('oo');box.innerHTML='';
 o.forEach((x,k)=>{const b=document.createElement('button');b.className='opt';const l=document.createElement('span');l.className='lt';l.textContent=String.fromCharCode(65+k);const t=document.createElement('span');t.textContent=x.t;b.append(l,t);b.onclick=()=>pick(b,x.c);b.dataset.c=x.c;box.appendChild(b)});
 fit()}
function pick(b,c){if(lock)return;lock=true;if(c)score++;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('ok')});
 if(!c)b.classList.add('no');$('sc').textContent='Score: '+score;
 setTimeout(()=>{i++;i<D.length?load():finish()},1300)}
function finish(){theme(0);$('pg').style.width='100%';const pb=best();const nb=pb===null||score>pb;if(nb)store.set('quiz_best_'+name.toLowerCase(),score);
 $('en').textContent=name+", tumhara final score";$('fs').textContent=score+'/'+D.length;
 const p=score*10;$('pc').textContent=p+'% sahi jawab';
 $('ms').textContent=score===10?"Perfect! Tum is dimaag ko poori tarah jaante ho.":score>=7?"Bahut badhiya! Tum kaafi gehraai se samajhte ho.":score>=4?"Theek-thaak! Thoda aur dhyaan se dekho.":"Abhi bahut kuch samajhna baaki hai. Dobara try karo!";
 $('bs').textContent=nb?(pb===null?"Pehla score save ho gaya.":"Naya best score! Pichla: "+pb+"/10"):"Tumhara best: "+pb+"/10";
 show('s-end')}
function home(){const b=best();$('best').textContent=name&&b!==null?"Best score: "+b+"/10":"";show('s-name')}
$('go').onclick=start;
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('again').onclick=()=>{i=0;score=0;show('s-quiz');load()};
$('chg').onclick=()=>{name="";$('nm').value="";$('best').textContent="";show('s-name')};
window.addEventListener('resize',()=>{if($('s-quiz').classList.contains('on'))fit()});
(function(){const n=store.get('quiz_name');if(n){$('nm').value=n;name=n;const b=best();if(b!==null)$('best').textContent="Best score: "+b+"/10"}})();
</script>
<script>
(function(){const stop=e=>e.preventDefault();
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(t=>document.addEventListener(t,stop));
document.addEventListener('selectstart',e=>{if(!(e.target&&e.target.tagName==='INPUT'))e.preventDefault()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&'cxvasup'.includes(e.key.toLowerCase()))e.preventDefault();if([' ','PageDown','PageUp','Home','End','ArrowDown','ArrowUp'].includes(e.key)&&e.target.tagName!=='INPUT')e.preventDefault()});
document.addEventListener('wheel',stop,{passive:false});
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
const top=()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0};
window.addEventListener('scroll',top);window.addEventListener('resize',top);document.addEventListener('focusin',()=>setTimeout(top,50));
const nm=document.getElementById('nm');nm.setAttribute('autocorrect','off');nm.setAttribute('spellcheck','false');
nm.addEventListener('input',()=>{nm.value=nm.value.replace(/[<>]/g,'')});
})();
</script>
</body>
</html>
